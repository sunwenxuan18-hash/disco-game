<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DISCO">
  <title>DISCO · 迪斯科舞厅</title>
  <style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #f1edf7;
  background: #101019;
  font-synthesis: none;
  --accent: #d1bff4;
  --muted: #a59bb6;
  --game-size: min(512px, calc(100vw - 24px), calc(100vh - 184px));
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 50% 35%, #20182e 0, #101019 72%); }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:focus-visible, canvas:focus-visible { outline: 2px solid #e2ceff; outline-offset: 3px; }
.layout {
  display: grid;
  grid-template-areas: "header" "stage" "controls" "status";
  grid-template-rows: 44px minmax(0, 1fr) 48px minmax(28px, auto);
  gap: 8px;
  width: min(100%, 640px);
  height: 100vh;
  min-height: 360px;
  margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.app-header { grid-area: header; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.wordmark { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
h1 { margin: 0; font-family: "Arial Black", -apple-system, sans-serif; font-size: 24px; font-weight: 900; letter-spacing: -.07em; line-height: 1; }
h1 > span { color: var(--accent); }
.wordmark p { margin: 0; color: var(--muted); font-size: 10px; letter-spacing: .07em; white-space: nowrap; }
.session-controls { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.session-controls button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 9px; border: 1px solid #3b334a; border-radius: 10px; background: #211b2c; color: #c4b8d8; font-size: 11px; white-space: nowrap; }
.session-controls button[aria-pressed="true"] { background: #342642; border-color: #a18ab9; color: #f0e2ff; }
.session-controls .help-button { padding: 0; font-size: 18px; }
.sound-mark { font-size: 18px; line-height: 1; }
.pause-mark { font-size: 15px; line-height: 1; }
.game-stage { grid-area: stage; display: grid; grid-template-rows: minmax(0, 1fr) 18px; gap: 6px; min-width: 0; min-height: 0; }
.game-viewport { display: grid; place-items: center; min-width: 0; min-height: 0; container-type: size; }
#game { display: block; width: var(--game-size); height: var(--game-size); max-width: 100%; aspect-ratio: 1; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.game-help { margin: 0; color: #aaa0bb; text-align: center; font-size: 11px; line-height: 18px; white-space: nowrap; }
.game-controls { grid-area: controls; display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 8px; min-width: 0; }
.direction-controls { display: grid; grid-template-columns: repeat(2, 44px); gap: 6px; }
.action-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 6px; min-width: 0; }
.control { display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 48px; padding: 0 5px; border: 1px solid #5a4d6d; border-radius: 12px; background: #292134; color: #e0d6ed; font-size: 13px; line-height: 1.1; }
.control > span { white-space: nowrap; }
.direction { font-family: Arial, sans-serif; font-size: 25px; font-weight: 400; }
.primary { color: #261836; background: var(--accent); border-color: #e6d8ff; font-weight: 600; }
.control:active, .control.is-pressed { background: #51405f; box-shadow: 0 2px 5px #08040e66 inset; }
.primary:active, .primary.is-pressed { background: #b99fdf; }
.status { grid-area: status; align-self: start; margin: 0; color: #a59bb6; text-align: center; font-size: 11px; line-height: 14px; overflow-wrap: anywhere; }
#install-help { position: fixed; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); padding: 24px; border: 1px solid #594968; border-radius: 18px; background: #21192e; color: #e8e0f0; line-height: 1.7; box-shadow: 0 12px 70px #0008; }
#install-help::backdrop { background: #07040ec9; }
#install-help h2 { margin: 0 40px 18px 0; font-size: 18px; }
#install-help h3 { margin: 20px 0 6px; font-size: 14px; }
#install-help p { margin: 10px 0; font-size: 13px; }
#install-help .keyboard-tip { color: #a79ab7; font-size: 11px; }
.dialog-close { position: absolute; top: 10px; right: 10px; min-width: 44px; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: #dbc8ed; font-size: 28px; line-height: 1; }
@supports (height: 100svh) {
  :root { --game-size: min(512px, calc(100vw - 24px), calc(100svh - 184px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); }
  .layout { height: 100svh; }
}
@supports (height: 100dvh) { .layout { height: 100dvh; } }
@supports (width: 1cqh) { #game { width: min(100cqw, 100cqh, 512px); height: min(100cqw, 100cqh, 512px); } }
@media (hover: hover) {
  .session-controls button:hover { background: #342740; border-color: #8a739e; }
  .control:hover { background: #3d304b; border-color: #a38bbd; }
  .primary:hover { background: #e0ceff; color: #261836; }
}
@media (max-width: 480px) { .wordmark p { display: none; } }
@media (max-width: 370px) {
  .layout { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  .game-controls { gap: 6px; }
  .action-controls { gap: 4px; }
  .control { font-size: 12px; }
  .direction { font-size: 25px; }
}
@media (orientation: landscape) and (max-height: 540px) and (max-width: 1100px) {
  .layout {
    width: min(100%, 1000px);
    min-height: 260px;
    grid-template-areas: "stage header" "stage controls" "stage status";
    grid-template-columns: minmax(0, 1fr) minmax(232px, 300px);
    grid-template-rows: 44px minmax(0, 1fr) minmax(28px, auto);
    column-gap: 16px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  .wordmark p { display: none; }
  .app-header { gap: 8px; }
  .game-controls { align-self: center; grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px 48px; gap: 8px; }
  .direction-controls { justify-content: center; }
  .game-help { font-size: 10px; }
  #game { --game-size: min(512px, calc(100vh - 48px), calc(100vw - 288px)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }

</style>

<body>
  <main class="layout" aria-labelledby="page-title">
    <header class="app-header">
      <div class="wordmark">
        <h1 id="page-title">DISCO<span aria-hidden="true">.</span></h1>
        <p>迪斯科舞厅</p>
      </div>
      <div class="session-controls" aria-label="游戏设置">
        <button id="sound-toggle" type="button" aria-pressed="false"><span class="sound-mark" aria-hidden="true">♪</span><span>音乐关闭</span></button>
        <button id="pause-toggle" type="button" aria-pressed="false"><span class="pause-mark" aria-hidden="true">Ⅱ</span><span>暂停</span></button>
        <button id="install-help-toggle" class="help-button" type="button" aria-label="使用说明"><span aria-hidden="true">?</span></button>
      </div>
    </header>

    <section class="game-stage" aria-label="游戏画面">
      <div class="game-viewport">
        <canvas id="game" width="128" height="128" tabindex="0" role="img" aria-label="Disco 迪斯科舞厅。可点选菜单，或使用下方按键。">您的浏览器需要支持 Canvas 才能显示游戏。</canvas>
      </div>
      <p id="mobile-help" class="game-help">点选菜单 · 上下键选择 · 中键确认</p>
    </section>

    <nav class="game-controls" aria-label="游戏操作">
      <div class="direction-controls" aria-label="选择方向">
        <button class="control direction" data-key="ArrowUp" type="button" aria-label="向上"><span aria-hidden="true">↑</span></button>
        <button class="control direction" data-key="ArrowDown" type="button" aria-label="向下"><span aria-hidden="true">↓</span></button>
      </div>
      <div class="action-controls">
        <button class="control" data-key="SoftLeft" type="button" aria-label="左功能键"><span id="soft-left-label">选择</span></button>
        <button class="control primary" data-key="Enter" type="button" aria-label="确认键"><span id="confirm-label">确认</span></button>
        <button class="control" data-key="SoftRight" type="button" aria-label="右功能键"><span id="soft-right-label">返回</span></button>
      </div>
    </nav>
    <p id="status" class="status" role="status" aria-live="polite">按确认键开始。</p>
  </main>
  <dialog id="install-help" aria-labelledby="install-help-title">
    <button id="install-help-close" class="dialog-close" type="button" aria-label="关闭说明">×</button>
    <h2 id="install-help-title">使用说明</h2>
    <p>轻点画面中的菜单项目，或用上下键选择，再按确认。</p>
    <p>营业时，左键打开经营菜单，中键开关欢乐时间，右键返回主菜单。</p>
    <h3>添加到 iPhone 主屏幕</h3>
    <p>用 Safari 打开网页，点击分享按钮，再选择“添加到主屏幕”。</p>
    <p id="offline-status">首次联网打开后，可以离线游玩。</p>
    <p class="keyboard-tip">电脑键盘：方向键选择，Enter 确认，F1 经营菜单，Esc 返回。</p>
  </dialog>

<script>
(async function () {
  'use strict';
  const canvas = document.getElementById('game');
  const statusEl = document.getElementById('status');
  const helpDialog = document.getElementById('install-help');

  const game = new DiscoEngine.Game();
  const audio = typeof DiscoAudio === 'function' ? new DiscoAudio() : null;
  const SAVE_KEY = 'disco-faithful-v1';
  const names = { lights:'灯光', floor:'舞池', ball:'迪斯科球', dancer:'跳舞女郎', speakers:'音响', decks:'控制设备', host:'主持人', advertising:'广告' };

  const adNames = ['派发传单','报纸广告','电视广告','会员派对'];
  const objectiveText = ['在31天内，赚到$10000。升级设备，吸引更多顾客。','在31天内，把开心指数提升到100。','在31天内，让舞厅人数达到300。'];

  let lastTime = performance.now(), elapsed = 0, saveAge = 0, lastDay = 0, lastEvent = null;

      row('购买视觉设备',()=>menu('视觉设备',['lights','floor','dancer','ball'].map(k=>row(names[k],()=>catalog(k))))),
      row('购买音响设备',()=>menu('音响设备',['speakers','decks'].map(k=>row(names[k],()=>catalog(k))))),

  function instructions() {
    setView({type:'dialog',title:'游戏说明',body:[
      '帮助Groove博士经营舞厅，完成三个挑战。','左功能键打开经营菜单。上下选择，确认购买。','营业时，按5或确认键开关欢乐时间。','欢乐时间能提高人气，但会持续消耗现金。','打广告吸引顾客。升级舞池、灯光和音响。','主持人会暂时提高人气；高级主持人需要更好的设备。','每一天30秒。打开菜单、暂停或离开页面时，游戏停止计时。','游戏进度自动保存。'
    ],scroll:0,left:'确定',right:'返回',onOK:()=>mainMenu(),onBack:()=>mainMenu()});
  }
  function about() { message('关于DISCO',['迪斯科舞厅','基于保存的原版像素素材和经营规则制作。','中文菜单重新制作。','原曲使用合成音色播放。'],()=>mainMenu()); }
  function showScores() { message('最高纪录',scores.map((n,i)=>'第'+(i+1)+'关：'+n+'分'),()=>mainMenu()); }
  function result() {
    const s=game.state, won=s.status==='won';
    if(won){unlocked=Math.max(unlocked,Math.min(3,s.level+1));scores[s.level-1]=Math.max(scores[s.level-1],s.score);}
    save();history=[];
    setView({type:'dialog',title:won?'挑战成功！':'挑战结束',body:won?['第'+s.level+'关已完成！','现金 $'+s.cash,'人数 '+s.visitors,'开心指数 '+s.happiness+'%',s.level<3?'继续挑战下一关。':'你已经成为舞厅大师！']:['这一关未能完成。','第'+s.day+'天  $'+s.cash,'试试及时打广告、升级设备，并留意现金。'],scroll:0,left:won&&s.level<3?'下一关':'主菜单',right:'主菜单',onOK:()=>won&&s.level<3?intro(s.level+1):mainMenu(),onBack:()=>mainMenu()});
  }
  function updatePause() {
    const b=document.getElementById('pause-toggle');b.setAttribute('aria-pressed',String(paused));b.querySelector('span:last-child').textContent=paused?'继续':'暂停';
    audio?.setPaused(paused||!visible||Boolean(helpDialog?.open));
  }
  function input(raw) {
    audio?.resumeFromGesture?.();
    const key = {'2':'ArrowUp','8':'ArrowDown','4':'ArrowLeft','6':'ArrowRight','5':'Enter',' ':'Enter','Escape':'SoftRight','F1':'SoftLeft','F2':'SoftRight'}[raw] || raw;
    if(paused && view.type==='game' && key==='Enter'){paused=false;updatePause();draw();return;}
    if(view.type==='title'){if(['Enter','SoftLeft','SoftRight'].includes(key))mainMenu();return;}
    if(view.type==='game'){
      if(key==='SoftLeft')options(); else if(key==='SoftRight')mainMenu();
      else if(key==='Enter'&&!paused){game.toggleHappyHour();save();say(game.state.happyHour?'欢乐时间已开启，现金将持续消耗。':'欢乐时间已关闭。');}
    }else if(view.type==='menu'){
      if(key==='ArrowDown'||key==='ArrowUp') {view.index=(view.index+(key==='ArrowDown'?1:-1)+view.rows.length)%view.rows.length;announce();}
      else if(key==='Enter'||key==='SoftLeft')view.rows[view.index]?.action();
      else if(key==='SoftRight')back();
    }else if(view.type==='dialog'){
      const lines=(Array.isArray(view.body)?view.body:[view.body]).flatMap(x=>renderer.wrap(x));
      if(key==='ArrowDown')view.scroll=Math.min(Math.max(0,lines.length-6),view.scroll+1);
      else if(key==='ArrowUp')view.scroll=Math.max(0,view.scroll-1);
      else if(key==='SoftRight')view.onBack?.();
      else if(key==='Enter'||key==='SoftLeft')view.onOK?.();
    }
    draw();
  }
  function draw() {
    if(view.type==='title')renderer.title(elapsed);
    else if(view.type==='game'){
      renderer.room(game.state,elapsed);if(paused)renderer.overlay('已暂停');
    }else if(view.type==='menu')renderer.menu(view.title,view.rows,view.index,{subtitle:view.subtitle});
    else renderer.dialog(view.title,view.body,{left:view.left,right:view.right,scroll:view.scroll});
    const s=game.state;
    const labels = view.type==='game' ? ['经营',paused?'继续':'欢乐时间','菜单']
      : view.type==='title' ? ['开始','开始游戏','开始']
      : view.type==='dialog' ? [view.left,view.left,view.right] : ['选择','确认','返回'];
    ['soft-left-label','confirm-label','soft-right-label'].forEach((id,i)=>{
      const element=document.getElementById(id);
      if(element && element.textContent!==labels[i]) element.textContent=labels[i];
      element?.closest('button')?.setAttribute('aria-label',labels[i]);
    });
    const center=document.getElementById('confirm-label')?.closest('button');
    if(center)center.setAttribute('aria-pressed',String(view.type==='game' && s.happyHour && !paused));
    const hint=document.getElementById('mobile-help');
    if(hint)hint.textContent=view.type==='game'?'左键经营 · 中键欢乐时间 · 右键菜单':view.type==='title'?'轻点画面，开始营业':view.type==='dialog'?'上下键翻页 · 确认或返回':'轻点菜单选项 · 上下键滚动';
    canvas.dataset.screen=view.type;
    canvas.dataset.title=view.title || (view.type==='game'?'舞厅':'DISCO');
    canvas.dataset.selection=view.type==='menu'?view.rows[view.index]?.label:'';
    canvas.dataset.cash=hasGame?s.cash:'';canvas.dataset.day=hasGame?s.day:'';
    canvas.dataset.visitors=hasGame?s.visitors:'';canvas.dataset.happiness=hasGame?s.happiness:'';
    canvas.dataset.paused=String(paused);canvas.dataset.happyHour=String(hasGame&&s.happyHour);
    canvas.setAttribute('aria-label',view.type==='game'?'舞厅，第'+s.day+'天，现金'+s.cash+'，人数'+s.visitors+'，开心指数'+s.happiness+'。':view.type==='menu'?view.title+'。当前选择：'+view.rows[view.index]?.label:view.type==='dialog'?view.title+'。'+String(view.body):'DISCO原版封面。按确认键开始。');
  }
  document.querySelectorAll('[data-key]').forEach(button=>{
    button.addEventListener('click',event=>{input(button.dataset.key);if(event.detail>0&&!matchMedia('(pointer: coarse)').matches)canvas.focus({preventScroll:true});});
    button.addEventListener('pointerdown',()=>button.classList.add('is-pressed'));
    ['pointerup','pointerleave','pointercancel'].forEach(t=>button.addEventListener(t,()=>button.classList.remove('is-pressed')));
  });
  // Touch the actual menu row. Keep the original pixels and keyboard controls.
  let touchStart=null;
  canvas.addEventListener('pointerdown',event=>{
    if(!event.isPrimary || event.button!==0)return;
    touchStart={x:event.clientX,y:event.clientY,id:event.pointerId};
  });
  canvas.addEventListener('pointercancel',()=>{touchStart=null;});
  canvas.addEventListener('pointerup',event=>{
    if(!touchStart || event.pointerId!==touchStart.id)return;
    const deltaX=event.clientX-touchStart.x,deltaY=event.clientY-touchStart.y;touchStart=null;
    audio?.resumeFromGesture?.();
    if(Math.abs(deltaY)>24 && Math.abs(deltaY)>Math.abs(deltaX) && ['menu','dialog'].includes(view.type)){
      input(deltaY<0?'ArrowDown':'ArrowUp');return;
    }
    if(Math.hypot(deltaX,deltaY)>16)return;
    const bounds=canvas.getBoundingClientRect();
    const x=(event.clientX-bounds.left)*128/bounds.width,y=(event.clientY-bounds.top)*128/bounds.height;
    if(x<0||x>=128||y<0||y>=128)return;
    if(view.type==='title'){input('Enter');return;}
    if(view.type==='menu'){
      if(y>=114){input(x<64?'SoftLeft':'SoftRight');return;}
      const capacity=view.subtitle?5:6,startY=view.subtitle?33:23;
      const start=Math.max(0,Math.min(view.index-Math.floor(capacity/2),view.rows.length-capacity));
      const visibleRow=Math.floor((y-startY+1)/14);
      if(visibleRow>=0&&visibleRow<capacity&&start+visibleRow<view.rows.length){view.index=start+visibleRow;input('Enter');}
    }else if(view.type==='dialog' && y>=114)input(x<64?'SoftLeft':'SoftRight');
  });
  const accepted=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape',' ','F1','F2','1','2','3','4','5','6','7','8','9','0','*','#']);
  document.addEventListener('keydown',event=>{
    if(helpDialog?.open)return;
    if(!accepted.has(event.key)||event.ctrlKey||event.metaKey||event.altKey)return;
    // Native button activation is handled by click; do not dispatch it twice.
    if(event.target instanceof HTMLButtonElement && ['Enter',' '].includes(event.key))return;
    event.preventDefault();if(event.repeat && !event.key.startsWith('Arrow'))return;input(event.key);
  });
  document.getElementById('pause-toggle').addEventListener('click',()=>{paused=!paused;updatePause();say(paused?'已暂停。':'继续营业。');save();draw();});
  document.getElementById('sound-toggle').addEventListener('click',async()=>{
    if(!audio)return;
    try {
      const wanted=!audio.enabled || audio.needsGesture;
      if(audio.enabled && audio.needsGesture) await audio.resumeFromGesture();
      else await audio.setEnabled(wanted);
      const b=document.getElementById('sound-toggle');b.setAttribute('aria-pressed',String(audio.enabled));b.querySelector('span:last-child').textContent=audio.enabled?'音乐开启':'音乐关闭';
      say(audio.enabled?(audio.needsGesture?'轻点音乐按钮恢复声音。':'原曲音乐已开启。'):wanted?'暂时无法播放，请再轻点音乐按钮。':'音乐已关闭。');
    }catch(_){say('当前浏览器暂时无法播放声音。');}
  });
  function syncVisibility() {
    visible=!document.hidden;lastTime=performance.now();updatePause();
    if(!visible)save();
  }
  document.addEventListener('visibilitychange',syncVisibility);
  window.addEventListener('pagehide',()=>{visible=false;save();audio?.setPaused(true);});
  window.addEventListener('pageshow',syncVisibility);
  if(helpDialog) new MutationObserver(()=>{lastTime=performance.now();updatePause();}).observe(helpDialog,{attributes:true,attributeFilter:['open']});
  function frame(now) {
    const dt=Math.min((now-lastTime)/1000,.25);lastTime=now;
    if(visible&&!paused&&!helpDialog?.open){elapsed+=dt;audio?.tick();}
    if(visible&&!paused&&!helpDialog?.open&&hasGame&&view.type==='game'&&game.state.status==='playing'){
      game.tick(dt);saveAge+=dt;
      if(game.state.status!=='playing')result();
      else if(game.state.day!==lastDay){lastDay=game.state.day;say('第'+lastDay+'天，现金$'+game.state.cash+'，人数'+game.state.visitors+'。');}
      const ev=game.state.event;
      if(ev && ev.id!==lastEvent){lastEvent=ev.id;say(ev.label);}
      if(!ev)lastEvent=null;
      const notices=game.drainMessages();
      if(notices.length && view.type==='game' && game.state.status==='playing') message('舞厅消息',notices,()=>returnToGame());
      if(saveAge>5){save();saveAge=0;}
    }
    if(visible && view.type==='game' && now-lastPaint>=1000/30){draw();lastPaint=now;}
    requestAnimationFrame(frame);
  }
  updatePause();announce();draw();requestAnimationFrame(frame);
})();

</script>
<script>
(function () {
  'use strict';
  const help = document.getElementById('install-help');
  const openHelp = document.getElementById('install-help-toggle');
  if (help && openHelp) {
    const close = () => typeof help.close === 'function' ? help.close() : help.removeAttribute('open');
    openHelp.addEventListener('click', () => typeof help.showModal === 'function' ? help.showModal() : help.setAttribute('open',''));
    document.getElementById('install-help-close')?.addEventListener('click', close);
    help.addEventListener('click', event => { if (event.target === help) close(); });
  }
  // A public HTTPS deployment can be installed from Safari and cached offline.
  // Plain downloaded HTML still plays without registering a service worker.
  if (document.querySelector('meta[name="disco-web-app"]') && 'serviceWorker' in navigator && /^(https?:)$/.test(location.protocol) && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(() => navigator.serviceWorker.ready).then(() => {
        const status=document.getElementById('offline-status');
        if(status)status.textContent='已准备好离线游玩。添加到主屏幕后，可像 App 一样打开。';
      }).catch(() => {
        const status=document.getElementById('offline-status');
        if(status)status.textContent='当前可以在线游玩，离线缓存暂不可用。';
      });
    }, { once: true });
  } else {
    const status=document.getElementById('offline-status');
    if(status)status.textContent='iPhone 请通过网页链接打开；电脑可直接打开 HTML 文件。';
  }
})();

</script>
