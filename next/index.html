<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d101e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DISCO">
  <meta name="description" content="经营属于你的迪斯科舞厅。升级灯光、邀请 DJ，让夜晚热闹起来。">
  <title>DISCO · 今晚，由你开场</title>
  <style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  font-synthesis: none;
  --ink: #0d101e;
  --surface: #181d31;
  --surface-raised: #232a43;
  --line: #343e5a;
  --text: #f2f3fb;
  --muted: #b2bbd3;
  --quiet: #8996b6;
  --mint: #a1e8dc;
  --violet: #b9a4ee;
  --peach: #edbc9e;
  --danger: #ffb5ad;
  background: var(--ink);
  color: var(--text);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 50% 40%, #171c32, var(--ink) 72%); }
button, input, select, textarea { font: inherit; }
button {
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
button:focus-visible, canvas:focus-visible, a:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
button:disabled { cursor: default; }
a { color: var(--mint); text-underline-offset: 3px; }

.club-app {
  display: grid;
  grid-template-areas: "header" "hud" "goal" "stage" "notice" "nav" "footer";
  grid-template-rows: 48px auto auto minmax(160px, 1fr) 38px 56px 18px;
  gap: 8px;
  width: min(100%, 760px);
  height: 100vh;
  min-height: 500px;
  margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
@supports (height: 100svh) { .club-app { height: 100svh; } }
@supports (height: 100dvh) { .club-app { height: 100dvh; } }

.app-header { grid-area: header; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: "Arial Black", "Helvetica Neue", sans-serif; font-size: 27px; font-weight: 900; letter-spacing: -.065em; line-height: 1; }
.brand h1 > span { color: var(--mint); }
.preview-tag { color: var(--quiet); font-size: 12px; white-space: nowrap; }
.session-tools { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.tool-button { display: inline-flex; justify-content: center; align-items: center; gap: 5px; min-height: 44px; min-width: 44px; padding: 0 9px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; }
.tool-button[aria-pressed="true"] { border-color: #547078; background: #173438; color: #c8fff3; }
.tool-symbol { font-size: 21px; line-height: 1; }
.pause-symbol { font-size: 16px; line-height: 1; }
.icon-only { font-size: 18px; border-color: #2d354c; border-radius: 50%; padding: 0; }

.club-hud { grid-area: hud; display: grid; grid-template-columns: 1.35fr 1fr 1fr; padding: 10px 0 9px; border-bottom: 1px solid #2c334b; }
.hud-item { min-width: 0; padding-left: 16px; border-left: 1px solid #2c334b; }
.hud-item:first-child { padding-left: 0; border-left: 0; }
.hud-caption { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; line-height: 1.4; white-space: nowrap; }
.hud-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); }
.hud-value { display: block; margin-top: 3px; font-size: clamp(22px, 6.4vw, 30px); line-height: 1.15; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.money .hud-value { color: var(--mint); }
.mood .hud-value { color: #e1d4ff; }
.goal-strip { grid-area: goal; min-width: 0; padding: 2px 0; }
.goal-heading { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.day-badge { flex: 0 0 auto; font-size: 13px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.mode-badge { color: var(--violet); font-size: 12px; white-space: nowrap; }
.goal-label { flex: 1; min-width: 0; text-align: right; color: var(--muted); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
#goal-progress { display: block; appearance: none; width: 100%; height: 3px; margin-top: 8px; border: 0; border-radius: 3px; overflow: hidden; color: var(--mint); background: #2a3147; }
#goal-progress::-webkit-progress-bar { background: #2a3147; border-radius: 3px; }
#goal-progress::-webkit-progress-value { background: var(--mint); border-radius: 3px; }
#goal-progress::-moz-progress-bar { background: var(--mint); border-radius: 3px; }

.club-stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
#club-canvas { display: block; width: 100%; height: 100%; min-height: 0; border: 0; outline-offset: -3px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.notice { grid-area: notice; align-self: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; color: #c3cbdf; font-size: 13px; line-height: 1.45; text-align: center; }
.game-nav { grid-area: nav; display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 9px; min-width: 0; }
.nav-button { display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; min-height: 56px; padding: 0 10px; border: 1px solid #3d4864; border-radius: 17px; background: #1c243b; color: #e9edf9; font-size: 16px; line-height: 1.2; font-weight: 600; white-space: nowrap; }
.nav-icon { color: var(--violet); font-size: 19px; line-height: 1; }
.happy-button { border-color: var(--mint); background: var(--mint); color: #102a2a; }
.happy-button .nav-icon { color: inherit; }
.happy-button[aria-pressed="true"] { background: var(--peach); border-color: #ffd8bc; color: #352418; }
.menu-symbol { font-size: 16px; }
.session-footer { grid-area: footer; display: flex; justify-content: center; align-items: center; gap: 5px; color: var(--quiet); font-size: 11px; line-height: 1.5; }
.save-indicator { width: 4px; height: 4px; border-radius: 50%; background: #78a597; }

.welcome { position: relative; padding: 0 14px 18px; text-align: center; }
.welcome-copy { margin-bottom: 23px; }
.eyebrow { color: var(--mint); font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; font-weight: 650; letter-spacing: .2em; }
.welcome h2 { margin: 10px 0 12px; font-size: clamp(27px, 7vw, 38px); line-height: 1.25; font-weight: 650; letter-spacing: -.05em; white-space: nowrap; }
.welcome h2 > span { color: var(--violet); }
.welcome p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
.welcome-actions { width: min(100%, 420px); margin: 0 auto; }
.mode-actions { display: grid; grid-template-columns: 1.25fr 1fr; gap: 10px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; min-width: 44px; padding: 12px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-raised); color: var(--text); font-size: 16px; font-weight: 600; line-height: 1.35; }
.button.primary { color: #122c2c; background: var(--mint); border-color: var(--mint); }
.button.secondary { color: #e0def3; background: #23273c; border-color: #45485f; }
.button.danger { color: #2c181b; background: var(--danger); border-color: var(--danger); }
.continue-button { justify-content: space-between; width: 100%; margin-bottom: 10px; }
.continue-button:not([hidden]) + .mode-actions .primary { color: var(--text); background: #23273c; border-color: #45485f; }
.continue-button:not([hidden]) + .mode-actions .button { min-height: 46px; font-size: 14px; }
body[data-screen="welcome"] .club-app { grid-template-areas: "header" "stage"; grid-template-rows: 48px minmax(0, 1fr); }
body[data-screen="welcome"] .club-hud,
body[data-screen="welcome"] .goal-strip,
body[data-screen="welcome"] .notice,
body[data-screen="welcome"] .game-nav,
body[data-screen="welcome"] .session-footer,
body[data-screen="welcome"] #pause-toggle { display: none; }
body[data-screen="welcome"] .club-stage { display: grid; grid-template-rows: minmax(160px, 1fr) auto; }
body[data-screen="game"] #welcome { display: none; }

.game-panel { position: fixed; inset: 0; width: min(480px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); max-height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); margin: auto; padding: 0; border: 1px solid #505a78; border-radius: 24px; background: #191f33; color: var(--text); box-shadow: 0 20px 80px #0008; }
.game-panel[open] { display: flex; flex-direction: column; }
.game-panel::backdrop { background: #050914bf; }
.panel-header { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 5px; align-items: center; flex: 0 0 auto; padding: 13px 12px 4px; }
.panel-header h2 { grid-column: 2; grid-row: 1; margin: 0; text-align: center; font-size: 21px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.panel-icon-button { display: grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #d5ddf2; font-size: 27px; line-height: 1; }
#panel-back { grid-column: 1; grid-row: 1; font-size: 25px; }
#panel-close { grid-column: 3; grid-row: 1; }
.panel-subtitle { flex: 0 0 auto; margin: 0; padding: 1px 22px 16px; color: var(--muted); font-size: 14px; line-height: 1.55; text-align: center; }
.panel-subtitle:empty { display: none; }
.panel-body { min-height: 0; padding: 8px 18px 18px; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #57637e transparent; }
.panel-actions { display: flex; gap: 10px; flex: 0 0 auto; padding: 14px 18px 18px; border-top: 1px solid #343d58; background: #191f33; }
.panel-actions:empty { display: none; }
.panel-actions > .button { flex: 1 1 0; min-width: 0; }
.menu-grid { display: grid; gap: 9px; }
.menu-row { display: grid; grid-template-columns: 39px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 70px; padding: 12px 13px; border: 1px solid #3b4560; border-radius: 15px; background: #242c44; color: var(--text); text-align: left; }
.row-icon { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: #343d59; color: var(--mint); font-size: 20px; }
.row-copy { min-width: 0; }
.row-title { display: block; font-size: 16px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.row-detail { display: block; margin-top: 4px; color: #b6c1da; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.row-value { color: var(--mint); font-size: 14px; font-weight: 600; line-height: 1.4; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.menu-row[aria-disabled="true"], .menu-row:disabled { background: #1e253a; border-color: #323b53; }
.menu-row[aria-disabled="true"] .row-value, .menu-row:disabled .row-value { color: #b9b3cf; }
.menu-row:disabled .row-title { color: #aeb7cf; }
.menu-row.is-selected { border-color: var(--mint); background: #273c45; }
.menu-row.is-owned .row-value { color: var(--violet); }
.dialog-copy { color: #dce2f3; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
.dialog-copy p { margin: 0 0 14px; }
.dialog-copy p:last-child { margin-bottom: 0; }
.dialog-copy strong { color: var(--text); }
.dialog-copy .muted, .muted { color: var(--muted); }
.dialog-copy .hint, .hint { color: var(--muted); font-size: 14px; line-height: 1.65; }
.stat-list { display: grid; gap: 0; margin: 0; font-variant-numeric: tabular-nums; }
.stat-list > div { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 13px 0; border-bottom: 1px solid #343d56; }
.stat-list > div:last-child { border-bottom: 0; }
.stat-list dt { color: var(--muted); font-size: 15px; }
.stat-list dd { margin: 0; color: var(--text); font-size: 17px; font-weight: 600; text-align: right; }
.panel-section-title { margin: 16px 0 10px; color: #d6def2; font-size: 14px; font-weight: 600; }
.panel-section-title:first-child { margin-top: 0; }
.empty-state { margin: 12px 0; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.7; }

button { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.button:active, .nav-button:active { transform: translateY(1px); filter: brightness(.92); }
.menu-row:active, .panel-icon-button:active { background: #35435b; }
@media (hover: hover) {
  .tool-button:hover, .panel-icon-button:hover { background: #252e45; color: #fff; }
  .menu-row:hover { background: #2d3852; border-color: #62748e; }
  .button:hover, .nav-button:hover { filter: brightness(1.08); }
}
@media (max-width: 420px) {
  .preview-tag { display: none; }
  .welcome { padding-left: 5px; padding-right: 5px; }
}
@media (max-width: 350px) {
  .club-app { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  .brand h1 { font-size: 25px; }
  .session-tools { gap: 1px; }
  .tool-button { padding: 0 6px; font-size: 12px; }
  .hud-item { padding-left: 10px; }
  .hud-value { font-size: 22px; }
  .game-nav { gap: 6px; }
  .nav-button { gap: 4px; padding: 0 5px; font-size: 15px; }
  .goal-label { font-size: 11px; }
  .welcome h2 { font-size: 26px; }
  .menu-row { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; padding: 10px; }
  .row-icon { width: 30px; height: 32px; font-size: 18px; }
  .row-value { font-size: 13px; }
  .panel-body { padding-left: 13px; padding-right: 13px; }
}
@media (max-height: 650px) and (orientation: portrait) {
  .club-app { grid-template-rows: 44px auto auto minmax(140px, 1fr) 34px 50px 16px; gap: 5px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  .club-hud { padding: 5px 0 7px; }
  .hud-value { font-size: 23px; }
  .goal-strip { padding: 0; }
  .nav-button { min-height: 50px; }
  body[data-screen="welcome"] .club-app { grid-template-rows: 44px minmax(0, 1fr); }
  body[data-screen="welcome"] .club-stage { grid-template-rows: minmax(145px, 1fr) auto; }
  .welcome { padding-bottom: 6px; }
  .welcome-copy { margin-bottom: 13px; }
  .welcome h2 { margin: 6px 0 7px; font-size: 27px; }
  .welcome p { font-size: 14px; line-height: 1.5; }
  .welcome-break { display: none; }
  .button { min-height: 48px; }
}
@media (orientation: landscape) and (max-height: 560px) and (max-width: 1200px) {
  .club-app {
    width: min(100%, 1100px);
    min-height: 320px;
    grid-template-areas: "stage header" "stage hud" "stage goal" "stage notice" "stage nav" "stage footer";
    grid-template-columns: minmax(0, 1fr) minmax(260px, 310px);
    grid-template-rows: 44px auto auto minmax(30px, 1fr) 52px 16px;
    gap: 6px 18px;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .preview-tag { display: none; }
  .brand h1 { font-size: 25px; }
  .session-tools { gap: 1px; }
  .tool-button { padding: 0 5px; font-size: 12px; }
  .hud-value { font-size: 24px; }
  .club-hud { padding: 5px 0 8px; }
  .nav-button { min-height: 52px; gap: 5px; padding: 0 6px; font-size: 15px; }
  .notice { font-size: 12px; }
  .goal-label { font-size: 11px; }
  body[data-screen="welcome"] .club-app { grid-template-areas: "stage header" "stage welcome"; grid-template-columns: minmax(0, 1fr) minmax(270px, 330px); grid-template-rows: 44px minmax(0, 1fr); }
  body[data-screen="welcome"] .club-stage { display: contents; }
  body[data-screen="welcome"] #club-canvas { grid-area: stage; }
  body[data-screen="welcome"] .welcome { grid-area: welcome; align-self: center; padding: 0 2px; }
  .welcome h2 { font-size: 27px; margin: 7px 0 9px; }
  .welcome-copy { margin-bottom: 15px; }
  .welcome p { font-size: 14px; }
  .welcome .button { padding-left: 12px; padding-right: 12px; min-height: 48px; }
  .game-panel { max-height: calc(100dvh - 20px); border-radius: 19px; }
  .panel-header { padding-top: 6px; }
  .panel-subtitle { padding-bottom: 9px; }
  .panel-actions { padding-top: 9px; padding-bottom: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

</style>
  
  
  
  
  
  
<meta name="disco-club-app" content="yes">
<link rel="manifest" href="./app.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
</head>
<body data-screen="welcome">
  <main class="club-app" aria-labelledby="club-title">
    <header class="app-header">
      <div class="brand">
        <h1 id="club-title">DISCO<span aria-hidden="true">.</span></h1>
        <span class="preview-tag">新舞厅</span>
      </div>
      <div class="session-tools" aria-label="游戏设置">
        <button id="sound-toggle" class="tool-button" type="button" aria-pressed="false" aria-label="开启音乐">
          <span class="tool-symbol" aria-hidden="true">♪</span><span data-label>音乐</span>
        </button>
        <button id="pause-toggle" class="tool-button" type="button" aria-pressed="false" aria-label="暂停营业">
          <span class="pause-symbol" aria-hidden="true">Ⅱ</span><span data-label>暂停</span>
        </button>
        <button id="help-toggle" class="tool-button icon-only" type="button" aria-label="使用说明"><span aria-hidden="true">?</span></button>
      </div>
    </header>

    <section class="club-hud" aria-label="经营数据">
      <div class="hud-item money">
        <span class="hud-caption"><span class="hud-dot" aria-hidden="true"></span>营业资金</span>
        <strong id="cash-value" class="hud-value">$2,000</strong>
      </div>
      <div class="hud-item">
        <span class="hud-caption">舞厅客人</span>
        <strong id="visitors-value" class="hud-value">3</strong>
      </div>
      <div class="hud-item mood">
        <span class="hud-caption">开心指数</span>
        <strong id="mood-value" class="hud-value">2%</strong>
      </div>
    </section>

    <section class="goal-strip" aria-label="营业进度">
      <div class="goal-heading">
        <span class="day-badge" id="day-value">第 1 天</span>
        <span class="mode-badge" id="mode-label">自由经营</span>
        <span id="goal-label" class="goal-label">把今晚经营得更好</span>
      </div>
      <progress id="goal-progress" max="1" value="0" aria-label="经营目标进度"></progress>
    </section>

    <section id="club-stage" class="club-stage" aria-label="你的舞厅">
      <canvas id="club-canvas" width="900" height="760" tabindex="0" role="img" aria-label="迪斯科舞厅。经营时可轻点设备查看升级。">当前浏览器需要支持 Canvas 才能显示舞厅。</canvas>
      <section id="welcome" class="welcome" aria-labelledby="welcome-title">
        <div class="welcome-copy">
          <span class="eyebrow">YOUR CLUB. YOUR NIGHT.</span>
          <h2 id="welcome-title">今晚，由你开场<span aria-hidden="true">。</span></h2>
          <p>没有期限，把小舞厅经营成<br class="welcome-break">你的夜生活地标。</p>
        </div>
        <div class="welcome-actions">
          <button id="continue-button" class="button primary continue-button" type="button" hidden><span>继续营业</span><span aria-hidden="true">↗</span></button>
          <div class="mode-actions">
            <button id="free-button" class="button primary" type="button"><span>自由经营</span><span aria-hidden="true">↗</span></button>
            <button id="challenge-button" class="button secondary" type="button">挑战模式</button>
          </div>
        </div>
      </section>
    </section>

    <p id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true">轻点舞厅设备，或打开经营菜单。</p>

    <nav class="game-nav" aria-label="舞厅操作">
      <button id="manage-button" class="nav-button manage-button" type="button"><span class="nav-icon" aria-hidden="true">✦</span><span>经营</span></button>
      <button id="happy-button" class="nav-button happy-button" type="button" aria-pressed="false"><span class="nav-icon" aria-hidden="true">♫</span><span>欢乐时间</span></button>
      <button id="menu-button" class="nav-button menu-button" type="button"><span class="nav-icon menu-symbol" aria-hidden="true">☰</span><span>菜单</span></button>
    </nav>

    <footer class="session-footer"><span class="save-indicator" aria-hidden="true"></span><span id="save-label">进度自动保存</span></footer>

    _getSong() {
      const songs = global.DiscoMusic && global.DiscoMusic.songs;
      if (!Array.isArray(songs)) return null;
      const filename = this.scene === 'game' ? 'title2.mid' : 'title.mid';

    tick() {

      gain.gain.exponentialRampToValueAtTime(SILENCE, end + release);

      filter.connect(gain);
      gain.connect(this.master);
      this._voice([oscillator], [oscillator, filter, gain], start, end + release + 0.008);

    _drum(start, pitch, velocity) {
      const ctx = this.context;
      const strength = clamp(velocity, 1, 127) / 127;
      if (pitch === 35 || pitch === 36) {

        oscillator.frequency.setValueAtTime(115, start);
        oscillator.frequency.exponentialRampToValueAtTime(42, start + 0.12);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5 * strength, start);
        gain.gain.exponentialRampToValueAtTime(SILENCE, start + 0.17);
        oscillator.connect(gain);
        gain.connect(this.master);
        this._voice([oscillator], [oscillator, gain], start, start + 0.18);

      filter.Q.value = hat ? 0.65 : rim ? 2 : 0.8;
      const gain = ctx.createGain();
      const peak = (hat ? 0.13 : rim ? 0.18 : 0.24) * strength;
      gain.gain.setValueAtTime(peak, start);
      gain.gain.exponentialRampToValueAtTime(SILENCE, start + length);

      filter.connect(gain);
      gain.connect(this.master);

<script>
(function (root) {
  'use strict';
  const KEY = 'disco-club-v2';
  const LEGACY_KEY = 'disco-faithful-v1';
  const empty = () => ({ version: 2, currentMode: 'free', sessions: { free: null, challenge: null }, unlocked: 1, scores: [0, 0, 0] });
  class ClubSaveStore {
    constructor(storage, Engine) {
      this.storage = storage;
      this.Engine = Engine;
      this.data = empty();
      this.available = true;
      this.migrated = false;
      this.load();
    }
    validate(snapshot, mode) {
      if (!snapshot || !['free', 'challenge'].includes(mode)) return null;
      const candidate = new this.Engine.Game();
      return candidate.restore(snapshot) && candidate.state.mode === mode ? candidate.snapshot() : null;
    }
    load() {
      let source;
      try { source = this.storage?.getItem(KEY); }
      catch (_) { this.available = false; return; }
      if (!this.storage) { this.available = false; return; }
      if (source) {
        try {
          const parsed = JSON.parse(source);
          if (parsed.version === 2) {
            for (const mode of ['free', 'challenge']) {
              const snapshot = this.validate(parsed.sessions?.[mode]?.snapshot, mode);
              if (snapshot) this.data.sessions[mode] = { snapshot, savedAt: Number(parsed.sessions[mode].savedAt) || 0 };
            }
            this.data.currentMode = parsed.currentMode === 'challenge' ? 'challenge' : 'free';
            this.readProgress(parsed);
            return;
          }
        } catch (_) { /* A broken new save must not prevent playing or legacy recovery. */ }
      }
      try {
        const old = JSON.parse(this.storage.getItem(LEGACY_KEY) || 'null');
        if (old?.version === 1) {
          this.readProgress(old);
          const snapshot = this.validate(old.game, 'challenge');
          if (snapshot) {
            this.data.sessions.challenge = { snapshot, savedAt: Date.now() };
            this.data.currentMode = 'challenge';
            this.migrated = true;
          }
        }
      } catch (_) { /* Storage or damaged legacy data is not fatal. */ }
    }
    readProgress(value) {
      this.data.unlocked = Math.max(1, Math.min(3, Math.floor(Number(value.unlocked)) || 1));
      this.data.scores = [0, 1, 2].map(i => Math.max(0, Number(value.scores?.[i]) || 0));
    }
    get(mode) { return this.data.sessions[mode]?.snapshot || null; }
    record(mode, game, { unlocked = this.data.unlocked, scores = this.data.scores } = {}) {
      if (!['free', 'challenge'].includes(mode) || game.state.mode !== mode) return false;
      this.data.sessions[mode] = { snapshot: game.snapshot(), savedAt: Date.now() };
      this.data.currentMode = mode;
      this.readProgress({ unlocked, scores });
      try {
        if (!this.storage) throw new Error('Storage unavailable');
        this.storage.setItem(KEY, JSON.stringify(this.data));
        this.available = true;
        return true;
      } catch (_) { this.available = false; return false; }
    }
  }

  root.DiscoClubSaveStore = ClubSaveStore;

        this.prism(c,u,v,.54,.63,25,k%2?'#9c819d':'#8b7396','#67516f','#594566');
      }
      const [x,y]=this.iso(1.18,5.25);
      this.line(c,[[x,y],[x,y-30]],'#766d88',5);
      this.ellipse(c,x,y-31,28,15,'#6f667b','#9b879d',2);
      this.ellipse(c,x-6,y-34,5,3,'#e2c6a2');
      this.line(c,[[x-6,y-34],[x-6,y-43]],'#c6a1b1',3);
      this.plant(c,.45,6.85,true);
      this.plant(c,7,.35,true);
    }

    buildStatic(e,key) {
      const c=this.cache.getContext('2d',{alpha:false});
      c.setTransform(1,0,0,1,0,0);
      const bg=c.createLinearGradient(0,0,this.cache.width,this.cache.height);
      bg.addColorStop(0,'#151726');bg.addColorStop(.55,'#1a1a2c');bg.addColorStop(1,'#111522');
      c.fillStyle=bg;c.fillRect(0,0,this.cache.width,this.cache.height);
      this.world(c);
      this.hotspots=[];
      const corners=[[0,0],[7.5,0],[7.5,7.5],[0,7.5]].map(p=>this.iso(...p));
      const [a,b,f,d]=corners, h=this.wallHeight;
      // The raised plinth gives the room a coherent miniature-set silhouette.
      this.ellipse(c,500,f[1]-36,417,82,'rgba(3,7,16,.27)');
      this.polygon(c,[[d[0],d[1]+22],[f[0],f[1]+34],[b[0],b[1]+22],b,a,d],'#101725');
      this.polygon(c,[a,d,[d[0],d[1]-h],[a[0],a[1]-h]],'#34304b');
      this.polygon(c,[a,b,[b[0],b[1]-h],[a[0],a[1]-h]],'#252c43');
      for(let i=1;i<8;i++) {
        let p=this.iso(0,i); this.line(c,[p,[p[0],p[1]-h]],'#41394f',1.5);
        p=this.iso(i,0); this.line(c,[p,[p[0],p[1]-h]],'#323a50',1.5);
      }
      // Two-layer crown lighting is cached, including its soft halo.
      const strip=[[d[0],d[1]-h+10],[a[0],a[1]-h+10],[b[0],b[1]-h+10]];
      c.save();c.shadowColor='#8d7bcb';c.shadowBlur=14;

      this.line(c,strip.map(([x,y])=>[x,y+7]),'#504461',3);
      this.line(c,[[a[0],a[1]-h],[a[0],a[1]]],'#464057',3);
      // Left wall inset arches, with a satin rather than shiny surface.
      for(const v of [3.05,5.65]) {
        const [x,y]=this.iso(0,v,h*.62);
        const poly=[[x-37,y-24],[x+30,y-57],[x+30,y+27],[x-37,y+61]];
        this.polygon(c,poly,'#242c43','#766586',2);
        this.line(c,[[x-27,y+41],[x-27,y-10],[x+19,y-33]],'#9b78b5',2);
        this.line(c,[[x-24,y+44],[x+18,y+23]],'#687d9f',2);
      }
      const sign=this.iso(2.9,0,h*.61);
      c.save();c.translate(sign[0],sign[1]);c.transform(1,.42,0,1,0,0);
      this.rounded(c,-5,-61,185,75,13,'#20283a','#475167');
      c.font='800 39px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';c.textBaseline='middle';
      c.fillStyle='#cae8df';c.fillText('DISCO',10,-27);
      this.line(c,[[13,-2],[162,-2]],'#6aabae',2);c.restore();
      const shelves=[this.iso(5.1,0,h*.59),this.iso(6.15,0,h*.59)];
      for(const [sx,sy] of shelves){this.line(c,[[sx-19,sy],[sx+27,sy+20]],'#79758c',4);this.rounded(c,sx-2,sy-24,8,25,2,'#8bafaa');this.rounded(c,sx+15,sy-12,8,24,2,'#bb8ea5');}
      const floorColors=e.floor>=3?['#476b81','#628c97','#727c9b','#6c658d']:
        e.floor>=2?['#42627c','#586e96','#665f8c','#537f8d']:
          e.floor>=1?['#354e6a','#4b6683','#51567a','#416d79']:['#35445d','#42445e','#3f4965','#33475e'];
      for(let u=0;u<7.5;u+=.75)for(let v=0;v<7.5;v+=.75) {
        const dance=u>=1.5&&u<6.75&&v>=2.25&&v<6.75;
        const idx=(Math.round(u/.75)+Math.round(v/.75)*2)%4;
        this.floorTile(c,u,v,.75,dance?floorColors[idx]:((Math.round((u+v)/.75)%2)?'#30364b':'#343b50'),'rgba(13,24,40,.32)');
      }
      const edging=[[1.5,2.25],[6.75,2.25],[6.75,6.75],[1.5,6.75]].map(p=>this.iso(...p));
      this.polygon(c,edging,null,e.floor?'#9db7c0':'#65788e',2);
      this.polygon(c,[d,f,[f[0],f[1]+15],[d[0],d[1]+15]],'#393a54');
      this.polygon(c,[b,f,[f[0],f[1]+15],[b[0],b[1]+15]],'#282f45');
      this.line(c,[d,f,b],'#7b819e',2);
      this.line(c,[[d[0],d[1]+17],[f[0],f[1]+28],[b[0],b[1]+17]],'#222a3f',4);
      this.lounge(c);
      this.booth(c,e);
      this.bar(c);
      this.lamps=[this.wallLamp(c,0,2,'left'),this.wallLamp(c,6.7,0,'right')];
      const lampP=this.lamps[0];this.hotspots.push({kind:'lights',x:lampP[0],y:lampP[1],rx:55,ry:48});
      const floorCenter=this.iso(4.2,4.5);this.hotspots.push({kind:'floor',x:floorCenter[0],y:floorCenter[1],rx:205,ry:130});
      if(e.dancer) {
        this.prism(c,2.95,1.42,.72,.72,24,'#8b759d','#674f81','#4b405f');
        const p=this.iso(3.3,1.8);this.hotspots.unshift({kind:'dancer',x:p[0],y:p[1]-35,rx:43,ry:62});
      }
      const ball=this.iso(2.15,2.15,h+80);
      this.line(c,[[ball[0],ball[1]-64],[ball[0],ball[1]-20]],'#727b99',2);
      if(!e.ball)this.ellipse(c,ball[0],ball[1]-13,9,9,'#98a5bc','#c2cddd',2);
      this.ballPosition=ball;
      this.hotspots.unshift({kind:'ball',x:ball[0],y:ball[1],rx:45,ry:50});
      this.cacheKey=key;
    }

    limbs(c,points,color,width) { this.line(c,points,'#192335',width+2);this.line(c,points,color,width); }

    person(c,u,v,index,time,energy=1,role='guest') {
      const [x,ground]=this.iso(u,v,role==='dj'?13:role==='dancer'?24:0);
      const p=PALETTES[index%PALETTES.length],phase=index*1.71;
      const beat=time*(role==='dj'?2.8:3.2)+phase;
      const bounce=(1+Math.sin(beat))*1.9*energy;
      const sway=Math.sin(beat*.5)*3.5*energy;
      const y=ground-bounce;

      const female=index%3===0, jacket=index%4===1;

      this.limbs(c,[[-5,-24],[-7-step*.4,-13],[-10-step,0]],pants,7);

      this.rounded(c,7+step,-2,12,6,2.5,'#e4d7db');

      if(role==='dj') {
        this.limbs(c,[[-11+sway,-45],[-18,-36],[-24,-38]],skin,5.5);
        this.limbs(c,[[11+sway,-45],[21,-34],[26,-37]],skin,5.5);
      } else {
        const lift=Math.sin(beat*.5+index)*10*energy;
        const armUp=index%2===0;
        this.limbs(c,[[-11+sway,-45],[-22+sway,-40-(armUp?12:0)-lift*.4],[-24+sway,-35-(armUp?27:0)-lift]],skin,5.3);
        this.limbs(c,[[11+sway,-45],[22+sway,-48+(armUp?7:-5)+lift*.35],[25+sway,-54+(armUp?12:-9)+lift]],skin,5.3);
      }
      this.rounded(c,-3+sway,-55,7,9,2,skin);
      if(female){this.ellipse(c,sway,-62,13,15,hair);this.ellipse(c,sway-9,-52,6,12,hair);}
      this.ellipse(c,sway,-64,10.5,12,skin);
      c.beginPath();c.moveTo(sway-11,-64);c.bezierCurveTo(sway-15,-83,sway+13,-82,sway+12,-64);
      c.quadraticCurveTo(sway+5,-75,sway-2,-69);c.quadraticCurveTo(sway-8,-66,sway-11,-64);c.fillStyle=hair;c.fill();
      if(index%5===3)this.ellipse(c,sway+7,-79,6,6,hair);
      this.ellipse(c,sway-3.7,-63,1.1,1.3,'#352d3c');this.ellipse(c,sway+4.1,-63,1.1,1.3,'#352d3c');
      this.line(c,[[sway-1,-56.5],[sway+3,-56.5]],'#9b6265',1.3);
      this.line(c,[[sway+.5,-62],[sway+1.5,-59]],'rgba(140,84,67,.5)',1);
      if(role==='dj') {
        c.beginPath();c.arc(sway,-65,13.7,Math.PI,TAU);c.strokeStyle='#242c43';c.lineWidth=3.7;c.stroke();
        this.rounded(c,sway-15,-66,5,11,2,'#7b8caa');this.rounded(c,sway+10,-66,5,11,2,'#7b8caa');
      }
      c.restore();
    }

    rays(c,e,time,happy) {
      if(!e.lights)return;
      c.save();
      const floor=[[0,0],[7.5,0],[7.5,7.5],[0,7.5]].map(p=>this.iso(...p));
      c.beginPath();floor.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();
      // Ground pools stay inside the dance floor; no full-scene blur per frame.
      c.save();c.clip();
      const count=e.lights>2?4:2;
      for(let i=0;i<count;i++) {
        const [x,y]=this.iso(3.7+Math.sin(time*.35+i*2)*1.5,4.5+Math.cos(time*.29+i*1.5)*1.5);
        const glow=c.createRadialGradient(x,y,4,x,y,130);
        glow.addColorStop(0,i%2?'rgba(172,122,219,.17)':'rgba(92,195,190,.16)');glow.addColorStop(1,'rgba(70,150,175,0)');
        c.fillStyle=glow;c.fillRect(x-130,y-130,260,260);
      }
      c.restore();
      for(let i=0;i<this.lamps.length;i++) {
        const [x,y]=this.lamps[i];const target=this.iso(3.3+Math.sin(time*.35+i*2)*1.2,4.5+Math.cos(time*.3+i*2)*1.5);
        const gradient=c.createLinearGradient(x,y,target[0],target[1]);
        gradient.addColorStop(0,i?'rgba(105,220,214,.15)':'rgba(197,143,232,.17)');
        gradient.addColorStop(1,'rgba(132,164,215,0)');
        this.polygon(c,[[x-5,y],[x+5,y],[target[0]+69,target[1]],[target[0]-69,target[1]]],gradient);
      }
      if(happy) {
        for(let i=0;i<15;i++) {
          const x=180+(i*97)%650,y=this.originY+120+(i*71)%330;
          const alpha=.22+.15*Math.sin(time*3+i);
          this.ellipse(c,x,y+Math.sin(time+i)*5,1.5,1.5,`rgba(242,211,168,${alpha})`);

    }

    discoBall(c,e,time) {
      if(!e.ball)return;
      const [x,y]=this.ballPosition, r=23;
      const glow=c.createRadialGradient(x-8,y-9,2,x,y,r);
      glow.addColorStop(0,'#e9e6f1');glow.addColorStop(.4,'#b6bddb');glow.addColorStop(1,'#68779d');
      this.ellipse(c,x,y,r,r,glow,'#b3bdd2',1);
      c.save();c.beginPath();c.arc(x,y,r-1,0,TAU);c.clip();

        const shift=Math.sin(time*.6+row*.3)*4;

      c.restore();this.ellipse(c,x-8,y-9,4.5,4.5,'rgba(255,255,255,.72)');
    }

    draw(state,time,options={}) {
      this.resize();
      const preview=!!options.preview;
      const e=preview?{lights:2,floor:2,ball:1,speakers:2,decks:2,dancer:0}:({...state?.equipment});
      const t=options.reducedMotion?0:options.paused?this.lastTime:Number.isFinite(time)?time:0;
      this.lastTime=t;
      const key=[this.width,this.height,this.dpr,...['lights','floor','ball','speakers','decks','dancer'].map(k=>e[k]||0)].join(':');

      this.person(c,1.5,.79,3,t,active?1:.18,'dj');
      // The counter front masks the operator's feet naturally.
      this.boothFront(c,e);
      this.discoBall(c,e,t);
      if(e.dancer)this.person(c,3.31,1.79,6,t,options.reducedMotion?0:1.25,'dancer');
      const visitors=preview?12:Math.max(0,Number(state?.visitors)||0);
      const crowd=Math.min(POSITIONS.length,Math.floor(visitors));
      const energy=options.reducedMotion?0:state?.happyHour?1.35:active?1:.62;
      const people=POSITIONS.slice(0,crowd).map(([u,v],i)=>({u,v,i}));
      people.sort((a,b)=>(a.u+a.v)-(b.u+b.v));
      people.forEach(({u,v,i})=>this.person(c,u,v,i,t,energy));
      this.canvas.dataset.renderedCrowd=String(crowd);
      this.canvas.dataset.renderStyle='cartoon';
    }

    boothFront(c,e) {
      const a=this.iso(.61,1.85,13),b=this.iso(2.66+(e.decks>1?.18:0),1.85,13);
      this.polygon(c,[a,b,[b[0],b[1]-48],[a[0],a[1]-48]],'#60467d');
      this.line(c,[[a[0]+8,a[1]-21],[b[0]-7,b[1]-21]],e.decks>1?'#78ded1':'#b899dc',3);
      this.line(c,[[a[0]+8,a[1]-15],[b[0]-7,b[1]-15]],'#49345c',2);
    }

    pick(clientX,clientY) {
      const r=this.canvas.getBoundingClientRect();
      if(clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom)return null;
      const x=(clientX-r.left-this.tx)/this.scale,y=(clientY-r.top-this.ty)/this.scale;
      for(const spot of this.hotspots)if(((x-spot.x)/spot.rx)**2+((y-spot.y)/spot.ry)**2<=1)return spot.kind;

<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('club-canvas');
  const panel = $('game-panel');

  const audio = typeof DiscoAudio === 'function' ? new DiscoAudio() : null;
  let storage = null;
  try { storage = window.localStorage; } catch (_) { /* Private storage may be unavailable. */ }
  const store = new DiscoClubSaveStore(storage, DiscoEngine);
  const game = new DiscoEngine.Game();
  let currentMode = store.data.currentMode;
  let hasGame = false;
  let screen = 'welcome';
  let paused = false;
  let visible = !document.hidden;
  let panelView = null;
  let elapsed = 0, lastTime = performance.now(), lastPaint = 0, lastHud = 0, saveAge = 0;
  let lastDay = 0, lastEvent = null, terminalShown = '';
  let offlineReady = false;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const names = { lights: '灯光', floor: '舞池', ball: '迪斯科球', dancer: '驻场舞者', speakers: '音响', decks: 'DJ 台', host: '驻场 DJ', advertising: '宣传推广' };
  const icons = { lights: '✦', floor: '▧', ball: '◉', dancer: '♬', speakers: '◖', decks: '◎', host: '♫', advertising: '↗', loan: '$', stats: '≋' };
  const descriptions = {
    lights: '让灯光跟着音乐流动', floor: '升级舞池，容纳更多客人', ball: '把星光洒进每一个角落',
    dancer: '让全场更快进入状态', speakers: '给舞厅更好的声音', decks: '为更出色的 DJ 做好准备',
    host: '邀请 DJ，让今晚热起来', advertising: '让更多人听说你的舞厅'
  };
  const previewState = { ...game.state, visitors: 9, happiness: 76, equipment: { lights: 2, floor: 1, ball: 1, dancer: 0, speakers: 1, decks: 1 }, host: { active: true }, happyHour: false };

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function put(id, value) { const el = $(id); if (el && el.textContent !== String(value)) el.textContent = value; }
  function say(text) { put('notice', text); }
  function format(value) { return Math.floor(value).toLocaleString('en-US'); }
  function refreshWelcome() {
    const mode = store.get(currentMode) ? currentMode : store.get('free') ? 'free' : 'challenge';
    const exists = Boolean(store.get(mode));
    $('continue-button').hidden = !exists;
    $('continue-button').textContent = mode === 'free' ? '继续自由经营' : '继续闯关';
    $('continue-button').dataset.mode = mode;
  }
  function save() {
    if (!hasGame) return;
    const ok = store.record(currentMode, game);

    saveAge = 0;
    refreshWelcome();
  }
  function syncAudio() {
    audio?.setScene(screen === 'welcome' ? 'title' : 'game');

    lastTime = performance.now();

  function closePanel() { if (panel.open) panel.close(); panelView = null; syncAudio(); }
  function panelAction(label, action, primary = false) {

    b.type = 'button';
    b.addEventListener('click', () => { audio?.resumeFromGesture?.(); action(); });
    return b;
  }
  function showPanel({ title, subtitle = '', build, actions = [], back = null }) {
    panelView = { back };
    put('panel-title', title);
    put('panel-subtitle', subtitle);
    $('panel-subtitle').hidden = !subtitle;
    $('panel-back').hidden = !back;
    $('panel-body').className = 'panel-body';
    $('panel-body').replaceChildren();
    $('panel-actions').replaceChildren(...actions.map(a => panelAction(a.label, a.action, a.primary)));
    build?.($('panel-body'));
    $('panel-body').scrollTop = 0;
    if (!panel.open) panel.showModal();
    syncAudio();
    // Focus a stable heading/close control so opening a long catalog never jumps down it.
    $('panel-close').focus({ preventScroll: true });
  }
  function copy(body, paragraphs) {
    const content = node('div', 'dialog-copy');
    for (const paragraph of paragraphs) content.append(node('p', '', paragraph));
    body.append(content);
  }

    const button = node('button', 'menu-row');

    if (detail) text.append(node('span', 'row-detail', detail));
    button.append(mark, text);
    if (value) button.append(node('span', 'row-value', value));

  }

    showPanel({ title, build: body => copy(body, paragraphs), back,
      actions: [...(cancel ? [{ label: '取消', action: cancel }] : []), { label: confirm, action, primary: true }] });
  }
  function enterGame() {
    hasGame = true; screen = 'game'; paused = false; terminalShown = ''; lastDay = game.state.day; lastEvent = null;
    document.body.dataset.screen = screen; $('welcome').hidden = true;
    closePanel(); syncAudio(); updateHud(); save();
    say(currentMode === 'free' ? '自由经营开始了。轻点设备，或打开经营菜单。' : '新的一晚开始了。先给舞厅添一点人气。');
    if (game.state.needsRecovery) showRecovery();
    else if (game.state.status !== 'playing') showResult();
  }
  function resumeMode(mode) {
    if (hasGame) save();
    const snapshot = store.get(mode);
    if (snapshot && game.restore(snapshot)) { currentMode = mode; enterGame(); return true; }
    return false;
  }
  function beginFree() {
    audio?.resumeFromGesture?.();
    if (resumeMode('free')) return;
    if (hasGame) save();
    currentMode = 'free'; game.startFree(); enterGame();
  }
  function selectChallenge() {
    showPanel({ title: '挑战模式', subtitle: '三个目标，逐步解锁。自由经营的进度会单独保留。',
      build(body) {
        body.className = 'panel-body menu-grid';
        if (store.get('challenge')) row(body, { title: '继续上次挑战', detail: '接着之前的进度营业', value: '继续', icon: '↗', action: () => resumeMode('challenge') });
        for (const objective of DiscoEngine.OBJECTIVES) {
          const unlocked = objective.level <= store.data.unlocked;
          row(body, { title: '第 ' + objective.level + ' 关 · ' + objective.title, detail: objective.description,
            value: unlocked ? '开始' : '未解锁', icon: String(objective.level), disabled: !unlocked,
            action: () => intro(objective.level) });
        }
      }, actions: [{ label: '返回', action: closePanel }] });
  }
  function intro(level) {
    const obj = DiscoEngine.OBJECTIVES[level - 1];
    describe('第 ' + level + ' 关 · ' + obj.title,
      [obj.description, '每个营业日为 30 秒，菜单打开时计时暂停。' + (store.get('challenge') ? '开始后将替换原来的闯关进度；自由经营不受影响。' : '')],
      { confirm: '开始挑战', action: () => { if (hasGame) save(); currentMode = 'challenge'; game.start(level); enterGame(); }, cancel: selectChallenge, back: selectChallenge });
  }
  function returnWelcome() {
    save(); closePanel(); screen = 'welcome'; document.body.dataset.screen = screen; $('welcome').hidden = false;
    refreshWelcome(); syncAudio(); say('选择你的下一场夜生活。');
  }
  function showMenu() {
    save();
    showPanel({ title: '你的舞厅', subtitle: currentMode === 'free' ? '自由经营 · 没有通关期限' : '挑战模式 · 第 ' + game.state.level + ' 关',
      build(body) {
        body.className = 'panel-body menu-grid';
        row(body, { title: '继续营业', detail: '回到舞池', action: closePanel, icon: '▷' });
        row(body, { title: '经营状况', detail: '查看设备、现金和贷款', action: showStats, icon: '≋' });
        row(body, { title: currentMode === 'free' ? '切换到挑战模式' : '切换到自由经营', detail: '两种模式分别保存进度', action: currentMode === 'free' ? selectChallenge : beginFree, icon: '⇄' });
        row(body, { title: '玩法与保存说明', detail: '操作、离线与添加到主屏幕', action: showHelp, icon: '?' });
        row(body, { title: '返回开始画面', detail: '进度已保存，随时再来', action: returnWelcome, icon: '⌂' });
      }, actions: [{ label: '继续营业', action: closePanel, primary: true }] });
  }
  function showManage() {
    if (game.state.needsRecovery) { showRecovery(); return; }
    showPanel({ title: '经营舞厅', subtitle: '可用现金 $' + format(game.state.cash),
      build(body) {
        body.className = 'panel-body menu-grid';
        for (const key of ['lights', 'floor', 'decks', 'speakers', 'ball', 'dancer', 'host', 'advertising']) {
          const tier = game.state.equipment[key] || 0;
          row(body, { title: names[key], detail: descriptions[key], icon: icons[key], value: key === 'host' ? (game.state.host.active ? '表演中' : '邀请') : key === 'advertising' ? '推广' : tier ? 'Lv.' + tier : '添置', action: () => showCatalog(key) });
        }
        row(body, { title: '周转贷款', detail: game.state.loan ? '尚需偿还 $' + format(game.state.loan) : '借入 $1,000，偿还 $1,500', icon: '$', value: game.state.loan ? '还款中' : '查看', action: showLoan });
      }, actions: [{ label: '返回舞厅', action: closePanel, primary: true }] });
  }
  function showCatalog(category) {
    if (!hasGame || game.state.needsRecovery) return;
    showPanel({ title: names[category], subtitle: '现金 $' + format(game.state.cash) + ' · 购买后立即生效', back: showManage,
      build(body) {
        body.className = 'panel-body menu-grid';
        for (const item of DiscoEngine.CATALOG[category]) {
          const owned = !['advertising', 'host'].includes(category) && (game.state.equipment[category] || 0) >= item.tier;
          const check = game.canBuy(category, item.tier);
          row(body, { title: item.label, detail: owned ? '已拥有这个级别或更好的设备' : !check.ok ? check.message : item.description,
            icon: icons[category], value: owned ? '已拥有' : '$' + format(item.cost), disabled: owned || !check.ok,
            action: () => confirmPurchase(category, item) });
        }
      }, actions: [{ label: '返回经营', action: showManage }] });
  }
  function confirmPurchase(category, item) {
    describe(item.label, [item.description, '本次花费 $' + format(item.cost) + '，购买后剩余 $' + format(game.state.cash - item.cost) + '。'],
      { confirm: category === 'host' ? '邀请登台' : category === 'advertising' ? '确认推广' : '确认购买', cancel: () => showCatalog(category), back: () => showCatalog(category), action: () => {
        const result = game.buy(category, item.tier);
        game.drainMessages();
        if (result.ok) { save(); closePanel(); updateHud(); say(result.message || '购买成功。'); }
        else describe('暂时无法购买', [result.message], { action: () => showCatalog(category) });
      } });
  }
  function showLoan() {
    if (game.state.loan) { describe('贷款还款中', ['尚需偿还 $' + format(game.state.loan) + '。营业收入会自动用于偿还贷款，结清后可以再次申请。'], { action: showManage, back: showManage }); return; }
    describe('周转贷款', ['借入 $1,000，需要偿还 $1,500。', '营业收入会自动用于还款，申请前请留意现金周转。'],
      { confirm: '申请贷款', cancel: showManage, back: showManage, action: () => {
        const result = game.takeLoan(); game.drainMessages(); save(); updateHud();
        if (result.ok) { closePanel(); say('贷款到账 $1,000。'); }
        else describe('暂时无法借款', [result.message], { action: showManage });
      } });
  }
  function showStats() {
    const s = game.state;
    showPanel({ title: '经营状况', subtitle: currentMode === 'free' ? '自由经营 · 第 ' + s.day + ' 天' : '第 ' + s.level + ' 关 · 第 ' + s.day + ' 天', back: showMenu,
      build(body) {
        body.className = 'panel-body';
        const list = node('dl', 'stat-list');
        for (const [label, value] of [['现金', '$' + format(s.cash)], ['客人', format(s.visitors) + ' 人'], ['开心指数', s.happiness + '%'], ['剩余贷款', '$' + format(s.loan)], ['驻场 DJ', s.host.active ? s.host.name : '暂未邀请'], ...Object.entries(s.equipment).map(([key, tier]) => [names[key], tier ? '等级 ' + tier : '尚未添置'])]) {
          const item = node('div'); item.append(node('dt', '', label), node('dd', '', value)); list.append(item);
        }
        body.append(list);
      }, actions: [{ label: '回到舞厅', action: closePanel, primary: true }] });
  }
  function showHelp() {
    showPanel({ title: '怎么玩', subtitle: '经营你自己的夜生活',
      build(body) {
        body.className = 'panel-body';
        copy(body, ['自由经营没有通关目标和营业天数限制。资金耗尽后，可以重整营业，保留设备继续玩。',
          '挑战模式保留三个目标关卡。两种模式分别存档，切换时不会覆盖另一边的进度。',
          '轻点舞厅里的设备，或打开「经营」购买设备、邀请 DJ、推广和贷款。欢乐时间能提高气氛，也会持续消耗现金。',
          '每个营业日为 30 秒。打开菜单、暂停或切到后台时，经营计时停止。',
          '进度约每 5 秒保存，也会在暂停和退出时保存。存档位于当前设备的浏览器，清理网站数据会删除存档。',
          '在 iPhone Safari 中打开，选择「分享 → 添加到主屏幕」，以后可以从桌面图标进入。',
          offlineReady ? '离线资源已准备好，完成首次加载后可以离线游玩。' : '联网打开后会准备离线资源；请等待首次加载完成。']);
      }, actions: [{ label: '知道了', action: closePanel, primary: true }] });
  }
  function showRecovery() {
    describe('休息一下，再开场', ['现金用完了，舞厅已暂停营业。', '重整后获得 $2,000 启动资金、结清贷款；保留设备、客人和营业天数。临时 DJ、活动和欢乐时间会结束。'],
      { confirm: '重整营业', cancel: closePanel, action: () => {
        const result = game.recoverFreeBusiness();
        if (result?.ok === false) { say(result.message || '当前无需重整。'); return; }
        terminalShown = ''; paused = false; save(); closePanel(); updateHud(); say('舞厅重新开张。已有设备都还在，继续创造好时光。');
      } });
  }
  function showResult() {
    const s = game.state;
    if (s.mode === 'free') { showRecovery(); return; }
    const won = s.status === 'won';
    if (won) {
      store.data.unlocked = Math.max(store.data.unlocked, Math.min(3, s.level + 1));
      store.data.scores[s.level - 1] = Math.max(store.data.scores[s.level - 1], s.score);
    }
    save();
    describe(won ? '今晚，属于你！' : '这一晚结束了',
      [won ? '第 ' + s.level + ' 关挑战完成。' : '这次没有完成目标，可以重新挑战，或到自由模式慢慢经营。',
        '现金 $' + format(s.cash) + ' · 客人 ' + format(s.visitors) + ' · 开心指数 ' + s.happiness + '%'],
      { confirm: won && s.level < 3 ? '挑战下一关' : '选择挑战', action: () => won && s.level < 3 ? intro(s.level + 1) : selectChallenge(), cancel: returnWelcome });
  }
  function updateHud() {
    const s = game.state;
    put('cash-value', '$' + format(s.cash)); put('visitors-value', format(s.visitors)); put('mood-value', s.happiness + '%');
    put('day-value', '第 ' + s.day + ' 天'); put('mode-label', currentMode === 'free' ? '自由经营' : '第 ' + s.level + ' 关');
    put('goal-label', currentMode === 'free' ? '不限营业天数，慢慢经营你的舞厅' : s.objective.description);
    $('goal-progress').hidden = currentMode === 'free'; $('goal-progress').max = 1; $('goal-progress').value = s.progress;
    $('goal-progress').setAttribute('aria-label', '挑战进度 ' + Math.round(s.progress * 100) + '%');
    const pauseText = $('pause-toggle').querySelector('[data-label]'); if (pauseText) pauseText.textContent = paused ? '继续' : '暂停';
    $('pause-toggle').setAttribute('aria-pressed', String(paused));
    $('pause-toggle').setAttribute('aria-label', paused ? '继续营业' : '暂停营业');
    $('pause-toggle').disabled = screen !== 'game' || s.needsRecovery || s.status !== 'playing';
    $('happy-button').setAttribute('aria-pressed', String(s.happyHour));
    $('happy-button').disabled = paused || s.needsRecovery || s.status !== 'playing';
    $('happy-button').classList.toggle('is-active', s.happyHour);
    canvas.dataset.screen = screen; canvas.dataset.mode = s.mode; canvas.dataset.day = s.day; canvas.dataset.cash = s.cash;
    canvas.dataset.visitors = s.visitors; canvas.dataset.happiness = s.happiness; canvas.dataset.paused = String(paused || panel.open);
    canvas.dataset.needsRecovery = String(Boolean(s.needsRecovery)); canvas.dataset.equipment = JSON.stringify(s.equipment);
    canvas.setAttribute('aria-label', screen === 'welcome' ? '卡通舞厅，选择一种模式开始营业。' : (currentMode === 'free' ? '自由经营' : '挑战模式') + '，第' + s.day + '天，现金' + s.cash + '，客人' + s.visitors + '，开心指数' + s.happiness + '%。');
  }
  $('free-button').addEventListener('click', beginFree);
  $('challenge-button').addEventListener('click', () => { audio?.resumeFromGesture?.(); selectChallenge(); });
  $('continue-button').addEventListener('click', () => { audio?.resumeFromGesture?.(); resumeMode($('continue-button').dataset.mode); });
  $('manage-button').addEventListener('click', showManage);
  $('menu-button').addEventListener('click', showMenu);
  $('help-toggle').addEventListener('click', showHelp);
  $('happy-button').addEventListener('click', () => {
    if (paused || panel.open || game.state.needsRecovery) return;
    audio?.resumeFromGesture?.(); game.toggleHappyHour(); save(); updateHud();
    say(game.state.happyHour ? '欢乐时间开启，客人更开心，现金也会持续消耗。' : '欢乐时间结束，恢复正常营业。');
  });
  $('pause-toggle').addEventListener('click', () => {
    if (!hasGame) return;
    paused = !paused; save(); syncAudio(); updateHud(); say(paused ? '营业已暂停，进度已保存。' : '继续营业。');
  });
  $('sound-toggle').addEventListener('click', async () => {
    if (!audio) return;
    try {
      if (audio.enabled && audio.needsGesture) await audio.resumeFromGesture();
      else await audio.setEnabled(!audio.enabled);
      syncAudio();
      $('sound-toggle').setAttribute('aria-pressed', String(audio.enabled));
      $('sound-toggle').setAttribute('aria-label', audio.enabled ? '关闭音乐' : '开启音乐');
      const text = $('sound-toggle').querySelector('[data-label]'); if (text) text.textContent = audio.enabled ? '音乐开' : '音乐关';
      say(audio.enabled ? audio.needsGesture ? '请再轻点音乐按钮恢复声音。' : '音乐已开启。' : '音乐已关闭。');
    } catch (_) { say('暂时无法播放，请再轻点音乐按钮。'); }
  });
  $('panel-close').addEventListener('click', closePanel);
  $('panel-back').addEventListener('click', () => panelView?.back?.());
  panel.addEventListener('close', () => { panelView = null; syncAudio(); updateHud(); });
  panel.addEventListener('cancel', event => { if (panelView?.back) { event.preventDefault(); panelView.back(); } });
  panel.addEventListener('click', event => {
    if (event.target !== panel) return;
    const b = panel.getBoundingClientRect();
    if (event.clientX < b.left || event.clientX > b.right || event.clientY < b.top || event.clientY > b.bottom) closePanel();
  });
  let pointer = null;
  canvas.addEventListener('pointerdown', event => { if (event.isPrimary && event.button === 0) pointer = { x: event.clientX, y: event.clientY, id: event.pointerId }; });
  canvas.addEventListener('pointercancel', () => { pointer = null; });
  canvas.addEventListener('pointerup', event => {
    const start = pointer; pointer = null;
    if (!start || start.id !== event.pointerId || Math.hypot(start.x - event.clientX, start.y - event.clientY) > 12) return;
    if (screen !== 'game' || panel.open || paused || game.state.needsRecovery) return;
    audio?.resumeFromGesture?.();
    const category = renderer.pick?.(event.clientX, event.clientY);
    if (category && names[category]) showCatalog(category);
  });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.repeat || panel.open || screen !== 'game' || event.target instanceof HTMLButtonElement) return;
    if (event.key === ' ') { event.preventDefault(); $('happy-button').click(); }
    if (event.key === 'Escape') showMenu();
    if (event.key.toLowerCase() === 'm') showManage();
  });
  function visibility() { visible = !document.hidden; if (!visible) save(); syncAudio(); }
  document.addEventListener('visibilitychange', visibility);
  window.addEventListener('pagehide', () => { visible = false; save(); syncAudio(); });
  window.addEventListener('pageshow', visibility);
  const resize = () => renderer.resize?.();
  window.addEventListener('resize', resize);
  window.visualViewport?.addEventListener('resize', resize);
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(canvas);
  function frame(now) {
    const dt = Math.max(0, Math.min((now - lastTime) / 1000, .25)); lastTime = now;
    const running = visible && !paused && !panel.open && screen === 'game' && hasGame && !game.state.needsRecovery && game.state.status === 'playing';
    if (visible && !paused && !panel.open) { elapsed += dt; audio?.tick(); }
    if (running) {
      game.tick(dt); saveAge += dt;
      if (game.state.needsRecovery || game.state.status !== 'playing') {
        const key = game.state.mode + ':' + game.state.status + ':' + Boolean(game.state.needsRecovery);
        if (terminalShown !== key) { terminalShown = key; save(); game.state.needsRecovery ? showRecovery() : showResult(); }
      } else {
        if (game.state.day !== lastDay) { lastDay = game.state.day; say('第 ' + lastDay + ' 天开场，继续经营你的舞厅。'); }
        const ev = game.state.event;
        if (ev && ev.id !== lastEvent) { lastEvent = ev.id; say(ev.label); }
        if (!ev) lastEvent = null;
        const notices = game.drainMessages();
        if (notices.length) { say(notices.join(' ')); }
      }
      if (saveAge >= 5) save();
    }
    if (visible && now - lastPaint >= 1000 / 30) {
      renderer.draw(screen === 'welcome' ? previewState : game.state, elapsed, { preview: screen === 'welcome', reducedMotion: reduced.matches, paused: paused || panel.open || Boolean(game.state.needsRecovery) });
      lastPaint = now;
    }
    if (visible && now - lastHud > 200) { updateHud(); lastHud = now; }
    requestAnimationFrame(frame);
  }
  await renderer.load?.();
  document.body.dataset.screen = 'welcome'; refreshWelcome(); updateHud(); resize();
  if (store.migrated) say('已找到原版挑战存档，可以选择「继续闯关」。');
  else if (!store.available) say('当前浏览器无法保存进度，但仍可试玩。');
  syncAudio(); requestAnimationFrame(frame);
  if (document.querySelector('meta[name="disco-club-app"]') && 'serviceWorker' in navigator && window.isSecureContext) {
    const register = async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        if (!registration.active) {
          const worker = registration.installing || registration.waiting;
          if (!worker) return;
          await new Promise((resolve, reject) => {
            const check = () => { if (worker.state === 'activated') resolve(); else if (worker.state === 'redundant') reject(); };
            worker.addEventListener('statechange', check); check();
          });
        }
        offlineReady = true;
      } catch (_) { /* Online play remains available when caching is unavailable. */ }
    };
    if (document.readyState === 'complete') register(); else window.addEventListener('load', register, { once: true });
  }
})();

</script>
</body>
