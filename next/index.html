        c.fillStyle=glow;c.fillRect(x-130,y-130,260,260);
      }
      c.restore();
      for(let i=0;i<this.lamps.length;i++) {
        const [x,y]=this.lamps[i];const target=this.iso(3.3+Math.sin(time*.35+i*2)*1.2,4.5+Math.cos(time*.3+i*2)*1.5);
        const gradient=c.createLinearGradient(x,y,target[0],target[1]);
        gradient.addColorStop(0,i?'rgba(105,220,214,.15)':'rgba(197,143,232,.17)');
        gradient.addColorStop(1,'rgba(132,164,215,0)');
        this.polygon(c,[[x-5,y],[x+5,y],[target[0]+69,target[1]],[target[0]-69,target[1]]],gradient);
      }
      if(happy) {
        for(let i=0;i<15;i++) {
          const x=180+(i*97)%650,y=this.originY+120+(i*71)%330;
          const alpha=.22+.15*Math.sin(time*3+i);
          this.ellipse(c,x,y+Math.sin(time+i)*5,1.5,1.5,`rgba(242,211,168,${alpha})`);
        }
      }
      c.restore();
    }

    discoBall(c,e,time) {
      if(!e.ball)return;
      const [x,y]=this.ballPosition, r=23;
      const glow=c.createRadialGradient(x-8,y-9,2,x,y,r);
      glow.addColorStop(0,'#e9e6f1');glow.addColorStop(.4,'#b6bddb');glow.addColorStop(1,'#68779d');
      this.ellipse(c,x,y,r,r,glow,'#b3bdd2',1);
      c.save();c.beginPath();c.arc(x,y,r-1,0,TAU);c.clip();
      for(let row=-3;row<=3;row++)for(let col=-3;col<=3;col++) {
        const shift=Math.sin(time*.6+row*.3)*4;
        const xx=x+col*7+shift,yy=y+row*7;
        const light=(col+row+Math.floor(time*.8))%3;
        c.fillStyle=light===0?'rgba(240,243,255,.8)':light===1?'rgba(112,143,185,.6)':'rgba(77,98,144,.55)';
        c.fillRect(xx-2.7,yy-2.7,5.2,5.2);
      }
      c.restore();this.ellipse(c,x-8,y-9,4.5,4.5,'rgba(255,255,255,.72)');
    }

    decoration(c,item,u,v) {
      const [x,y]=this.iso(u,v);
      const kind=String(item.itemId||item.type||'plant');
      if(kind==='plant') { this.plant(c,u,v); return; }
      if(kind==='sofa') {
        this.prism(c,u-.27,v-.15,.54,.3,18,this.theme.sofa[0],'#72576b','#524659');
        this.prism(c,u-.27,v-.22,.54,.09,39,this.theme.sofa[1],'#72576b','#524659');
        this.prism(c,u-.3,v-.19,.08,.4,27,this.theme.sofa[0],'#72576b','#524659');
        this.prism(c,u+.23,v-.19,.08,.4,27,this.theme.sofa[0],'#72576b','#524659');
        return;
      }
      if(kind==='mirrorBall') {
        this.ellipse(c,x,y,16,6,'rgba(9,17,28,.3)');
        this.line(c,[[x,y],[x,y-47]],'#8795ad',3);
        this.ellipse(c,x,y-57,14,14,'#b3c2d7','#687b9d',1.4);
        for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++) {
          c.fillStyle=(j+k)%2?'#d8e9eb':'#7e99b8';c.fillRect(x+k*7-2.5,y-59+j*7,5,5);
        }
        this.line(c,[[x-6,y-74],[x-6,y-81]],'#e7eee8',1.5);
        this.line(c,[[x-9.5,y-77.5],[x-2.5,y-77.5]],'#e7eee8',1.5);
        return;
      }
      // A freestanding sign remains movable in every supported zone.
      this.line(c,[[x-14,y],[x-10,y-45]],'#565e77',3);
      this.line(c,[[x+14,y],[x+10,y-45]],'#565e77',3);
      this.rounded(c,x-25,y-61,50,37,6,'#252a43',this.theme.trim);
      this.line(c,[[x-8,y-37],[x-8,y-51],[x+9,y-55],[x+9,y-41]],'#cf9bd6',2.5);
      this.ellipse(c,x-12,y-36,5,3,'#a8e5dc');
      this.ellipse(c,x+5,y-40,5,3,'#a8e5dc');
    }

    editGrid(c,zone,selected) {
      const r=ZONES[zone];if(!r)return;
      for(let y=0;y<3;y++)for(let x=0;x<4;x++) {
        const u=r.u+x*r.w/4,v=r.v+y*r.d/3;
        const pts=[[u,v],[u+r.w/4,v],[u+r.w/4,v+r.d/3],[u,v+r.d/3]].map(p=>this.iso(...p));
        const active=selected?.zone===zone&&selected?.x===x&&selected?.y===y;
        this.polygon(c,pts,active?'rgba(239,210,154,.32)':'rgba(123,214,203,.1)',active?'#f2d9aa':'rgba(174,224,218,.65)',active?3:1.2);
      }
    }

    guestTarget(guest,index,order,decor) {
      const activity=guest.activity||'dance';
      if(activity==='queue')return [6.88,2.26+Math.min(order,9)*.36];
      if(activity==='drink')return [4.75+(order%3)*.82,1.5+Math.min(2,Math.floor(order/3))*.36];
      if(activity==='rest')return [.7+(order%2)*.38,4.25+Math.min(3,Math.floor(order/2))*.58];
      if(activity==='leave')return [7.12,7.13];
      let [u,v]=POSITIONS[index%POSITIONS.length];
      // Decorations do not alter simulation capacity; avoid drawing feet through a pot.
      for(const item of decor) {
        if(item.zone!=='dance')continue;
        const at=this.cellPosition(item.zone,item.x,item.y);
        if(Math.hypot(u-at[0],v-at[1])<.5) {
          u=clamp(u+(u>at[0]?.42:-.42),1.8,6.8);
          v=clamp(v+.27,2.6,6.9);
        }
      }
      return [u,v];
    }

    liveCrowd(state,time,options,decor) {
      const guests=Array.isArray(state.guests)?state.guests:[];
      const visible=guests.slice(0,POSITIONS.length);
      const ids=new Set(visible.map(g=>String(g.id)));
      for(const id of this.guestViews.keys())if(!ids.has(id))this.guestViews.delete(id);
      const dt=options.paused||options.reducedMotion?0:clamp(time-this.lastCrowdTime,0,.2);
      this.lastCrowdTime=time;
      const orders={};
      return visible.map((g,i)=>{
        const activity=g.activity||'dance',order=orders[activity]||0;orders[activity]=order+1;
        const target=this.guestTarget(g,i,order,decor),id=String(g.id);
        let view=this.guestViews.get(id);
        if(!view) {
          // Restored customers already inside the club should not all re-enter
          // from the door when the player opens a menu immediately after loading.
          const alreadyInside=options.reducedMotion||Number(g.elapsed)>2;
          view={u:alreadyInside?target[0]:7.12,v:alreadyInside?target[1]:7.13};
          this.guestViews.set(id,view);
        }
        const dx=target[0]-view.u,dv=target[1]-view.v,length=Math.hypot(dx,dv);
        const fraction=options.reducedMotion?1:length?Math.min(1,dt*3.4/length):1;
        view.u+=dx*fraction;view.v+=dv*fraction;
        const moving=Math.hypot(target[0]-view.u,target[1]-view.v)>.16;
        const seed=Number.isFinite(g.lookSeed)?Math.abs(Math.floor(g.lookSeed)):Array.from(id).reduce((n,ch)=>n+ch.charCodeAt(0),0);
        return {u:view.u,v:view.v,i:seed,activity,role:moving?'walk':activity==='dance'?'guest':activity,energy:moving?.42:activity==='dance'?.85:activity==='rest'?.07:.12};
      });
    }

    servicePeople(c,state,time) {
      const staff=state.staff||{},working=role=>!state.basicMode&&staff[role]?.hired&&staff[role]?.onDuty;
      if(state.equipment?.bar&&working('bartender')) {
        this.person(c,5.73,.38,5,time,.16,'bartender');
        // Repaint the counter over the operator, hiding the body below its top.
        this.bar(c,state.equipment.bar);
      }
      const people=[];
      if(state.equipment?.lounge&&working('server'))people.push({u:1.35,v:3.75,i:1,role:'server',energy:.12});
      if(working('manager'))people.push({u:7.05,v:5.9,i:4,role:'manager',energy:.06});
      this.canvas.dataset.serviceStaff=['dj','bartender','server','manager'].filter(working).join(',');
      return people;
    }

    draw(state,time,options={}) {
      this.resize();
      const preview=!!options.preview;
      const e=preview?{lights:2,floor:2,ball:1,speakers:2,decks:2,dancer:0}:({...state?.equipment});
      this.freeScene=!preview&&state?.mode==='free'&&Number.isFinite(state?.venue);
      const venue=this.freeScene?clamp(state.venue,1,3):3;
      this.roomScale=this.freeScene?[.8,.9,1][venue-1]:1;
      this.theme=this.freeScene&&state.theme==='tropical'?WARM:this.freeScene&&state.theme==='neon'?ELECTRIC:NEON;
      const t=options.reducedMotion?0:options.paused?this.lastTime:Number.isFinite(time)?time:0;
      this.lastTime=t;
      const key=[this.width,this.height,this.dpr,this.freeScene,venue,this.freeScene?state.theme:'classic',!!state?.basicMode,...['lights','floor','ball','speakers','decks','dancer','bar','lounge'].map(k=>e[k]||0)].join(':');
      if(this.cacheKey!==key)this.buildStatic(e,key,state);
      const c=this.ctx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.drawImage(this.cache,0,0);
      this.world(c);
      this.rays(c,e,t,!!state?.happyHour);
      const active=preview||(this.freeScene?(!state.basicMode&&state.staff?.dj?.hired&&state.staff.dj.onDuty):state?.host?.active);
      // A house operator remains behind the desk; hiring a DJ adds energy.
      this.person(c,1.5,.79,3,t,active?1:.18,this.freeScene&&!active?'operator':'dj');
      // The counter front masks the operator's feet naturally.
      this.boothFront(c,e);
      this.discoBall(c,e,t);
      if(e.dancer)this.person(c,3.31,1.79,6,t,options.reducedMotion?0:1.25,'dancer');
      const visitors=preview?12:Math.max(0,Number(state?.visitors)||0);
      const energy=options.reducedMotion?0:state?.happyHour?1.35:active?1:.62;
      const decor=this.freeScene&&Array.isArray(state.decor)?state.decor.filter(item=>item.placed&&ZONES[item.zone]):[];
      const people=this.freeScene?this.liveCrowd(state,t,options,decor):POSITIONS.slice(0,Math.min(POSITIONS.length,Math.floor(visitors))).map(([u,v],i)=>({u,v,i,role:'guest',energy}));
      if(options.editZone)this.editGrid(c,options.editZone,options.selectedDecor);
      const service=this.freeScene?this.servicePeople(c,state,t):[];
      const decorations=decor.map(item=>{const [u,v]=this.cellPosition(item.zone,item.x,item.y);return {u,v,item};});
      [...people,...service,...decorations].sort((a,b)=>(a.u+a.v)-(b.u+b.v)).forEach(item=>{
        if(item.item)this.decoration(c,item.item,item.u,item.v);
        else this.person(c,item.u,item.v,item.i,t,options.reducedMotion?0:item.energy,item.role);
      });
      this.canvas.dataset.renderedCrowd=String(people.length);
      this.canvas.dataset.renderedDecor=String(decor.length);
      this.canvas.dataset.venue=String(this.freeScene?venue:0);
      this.canvas.dataset.theme=this.freeScene?String(state.theme||'classic'):'classic';
      this.canvas.dataset.renderedActivities=JSON.stringify(people.reduce((counts,p)=>{const a=p.activity||'dance';counts[a]=(counts[a]||0)+1;return counts;},{}));
      if(!this.freeScene)this.canvas.dataset.serviceStaff='';
      this.canvas.dataset.renderStyle='cartoon';
    }

    boothFront(c,e) {
      const a=this.iso(.61,1.85,13),b=this.iso(2.66+(e.decks>1?.18:0),1.85,13);
      this.polygon(c,[a,b,[b[0],b[1]-48],[a[0],a[1]-48]],'#60467d');
      this.line(c,[[a[0]+8,a[1]-21],[b[0]-7,b[1]-21]],e.decks>1?'#78ded1':'#b899dc',3);
      this.line(c,[[a[0]+8,a[1]-15],[b[0]-7,b[1]-15]],'#49345c',2);
    }

    pick(clientX,clientY) {
      const r=this.canvas.getBoundingClientRect();
      if(clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom)return null;
      const x=(clientX-r.left-this.tx)/this.scale,y=(clientY-r.top-this.ty)/this.scale;
      for(const spot of this.hotspots)if(((x-spot.x)/spot.rx)**2+((y-spot.y)/spot.ry)**2<=1)return spot.kind;
      return null;
    }

    pickCell(clientX,clientY,zone) {
      const area=ZONES[zone];if(!area)return null;
      const r=this.canvas.getBoundingClientRect();
      if(clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom)return null;
      const x=(clientX-r.left-this.tx)/this.scale,y=(clientY-r.top-this.ty)/this.scale;
      const a=(x-500)/(58*this.roomScale);
      const b=(y-this.originY-(1-this.roomScale)*7.5*this.depth)/(this.depth*this.roomScale);
      const u=(a+b)/2,v=(b-a)/2;
      if(u<area.u||u>=area.u+area.w||v<area.v||v>=area.v+area.d)return null;
      return {x:Math.floor((u-area.u)/area.w*4),y:Math.floor((v-area.v)/area.d*3)};
    }

    destroy() { this.cache.width=1;this.cache.height=1;this.hotspots=[];this.guestViews.clear(); }
  }
  root.DiscoClubRenderer=DiscoClubRenderer;
  if(typeof module!=='undefined'&&module.exports)module.exports=DiscoClubRenderer;
})(globalThis);

</script>
<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('club-canvas');
  const panel = $('game-panel');
  const renderer = new DiscoClubRenderer(canvas);
  const audio = typeof DiscoAudio === 'function' ? new DiscoAudio() : null;
  let storage = null;
  try { storage = window.localStorage; } catch (_) { /* Private storage may be unavailable. */ }
  const store = new DiscoClubSaveStore(storage, DiscoEngine, DiscoFreeEngine);
  const clock = new DiscoSessionClock(store);
  let game = new DiscoEngine.Game();
  let canWrite = false;
  let currentMode = store.data.currentMode;
  let hasGame = false;
  let screen = 'welcome';
  let paused = false;
  let visible = !document.hidden;
  let panelView = null;
  let elapsed = 0, lastTime = performance.now(), lastPaint = 0, lastHud = 0, saveAge = 0;
  let lastDay = 0, lastEvent = null, terminalShown = '';
  let offlineReady = false;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const names = { lights: '灯光', floor: '舞池', ball: '迪斯科球', dancer: '驻场舞者', speakers: '音响', decks: 'DJ 台', host: '驻场 DJ', advertising: '宣传推广', venue: '场地扩建', bar: '吧台', lounge: '休息区' };
  const icons = { lights: '✦', floor: '▧', ball: '◉', dancer: '♬', speakers: '◖', decks: '◎', host: '♫', advertising: '↗', loan: '$', stats: '≋', venue: '⌂', bar: '♧', lounge: '▱' };
  const zones = { dance: '舞池区', bar: '吧台区', lounge: '休息区' };
  const descriptions = {
    lights: '让灯光跟着音乐流动', floor: '升级舞池，容纳更多客人', ball: '把星光洒进每一个角落',
    dancer: '让全场更快进入状态', speakers: '给舞厅更好的声音', decks: '为更出色的 DJ 做好准备',
    host: '邀请 DJ，让今晚热起来', advertising: '让更多人听说你的舞厅', venue: '扩大舞厅，解锁新设施', bar: '升级出杯速度，服务更多订单', lounge: '让客人舒适地休息'
  };
  const previewState = { ...game.state, visitors: 9, happiness: 76, equipment: { lights: 2, floor: 1, ball: 1, dancer: 0, speakers: 1, decks: 1 }, host: { active: true }, happyHour: false };

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function put(id, value) { const el = $(id); if (el && el.textContent !== String(value)) el.textContent = value; }
  function say(text) { put('notice', text); }
  function format(value) { return Math.floor(Number(value) || 0).toLocaleString('en-US'); }
  function money(value) { return '$' + (Number(value) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function isFree() { return currentMode === 'free'; }
  function offlineEnabled() { return isFree() && screen === 'game' && !paused && !game.state.needsRecovery && game.state.status === 'playing'; }
  function refreshWelcome() {
    const mode = store.get(currentMode) ? currentMode : store.get('free') ? 'free' : 'challenge';
    const exists = Boolean(store.get(mode));
    $('continue-button').hidden = !exists;
    $('continue-button').textContent = mode === 'free' ? '继续自由经营' : '继续闯关';
    $('continue-button').dataset.mode = mode;
  }
  function save() {
    if (!hasGame || !canWrite || !visible) return;
    const ok = clock.record(currentMode, game, { offlineEnabled: offlineEnabled() });
    put('save-label', ok ? '进度已保存' : '当前浏览器无法保存');
    saveAge = 0;
    refreshWelcome();
  }
  function syncAudio() {
    audio?.setScene(screen === 'welcome' ? 'title' : 'game');
    audio?.setPaused(!visible || (screen === 'game' && (paused || panel.open || game.state.needsRecovery || game.state.status !== 'playing')) || (screen === 'welcome' && panel.open));
    lastTime = performance.now();
  }
  function closePanel() { if (panel.open) panel.close(); panelView = null; syncAudio(); }
  function panelAction(label, action, primary = false) {
    const b = node('button', 'button ' + (primary ? 'primary' : 'secondary'), label);
    b.type = 'button';
    b.addEventListener('click', () => { audio?.resumeFromGesture?.(); action(); });
    return b;
  }
  function showPanel({ title, subtitle = '', build, actions = [], back = null }) {
    panelView = { back };
    put('panel-title', title);
    put('panel-subtitle', subtitle);
    $('panel-subtitle').hidden = !subtitle;
    $('panel-back').hidden = !back;
    $('panel-body').className = 'panel-body';
    $('panel-body').replaceChildren();
    $('panel-actions').replaceChildren(...actions.map(a => panelAction(a.label, a.action, a.primary)));
    build?.($('panel-body'));
    $('panel-body').scrollTop = 0;
    if (!panel.open) panel.showModal();
    syncAudio();
    // Focus a stable heading/close control so opening a long catalog never jumps down it.
    $('panel-close').focus({ preventScroll: true });
  }
  function copy(body, paragraphs) {
    const content = node('div', 'dialog-copy');
    for (const paragraph of paragraphs) content.append(node('p', '', paragraph));
    body.append(content);
  }
  function row(body, { title, detail = '', value = '', icon = '↗', action, disabled = false }) {
    const button = node('button', 'menu-row');
    button.type = 'button';
    const mark = node('span', 'row-icon', icon); mark.setAttribute('aria-hidden', 'true');
    const text = node('span', 'row-copy');
    text.append(node('span', 'row-title', title));
    if (detail) text.append(node('span', 'row-detail', detail));
    button.append(mark, text);
    if (value) button.append(node('span', 'row-value', value));
    button.disabled = disabled;
    button.setAttribute('aria-disabled', String(disabled));
    button.addEventListener('click', () => { audio?.resumeFromGesture?.(); action?.(); });
    body.append(button);
  }
  function describe(title, paragraphs, { confirm = '知道了', action = closePanel, cancel, back } = {}) {
    showPanel({ title, build: body => copy(body, paragraphs), back,
      actions: [...(cancel ? [{ label: '取消', action: cancel }] : []), { label: confirm, action, primary: true }] });
  }
  function enterGame() {
    hasGame = true; screen = 'game'; paused = false; terminalShown = ''; lastDay = game.state.day; lastEvent = null;
    document.body.dataset.screen = screen; $('welcome').hidden = true;
    closePanel(); syncAudio(); updateHud(); save();
    say(currentMode === 'free' ? '自由经营开始了。轻点设备，或打开经营菜单。' : '新的一晚开始了。先给舞厅添一点人气。');
    if (game.state.needsRecovery) showRecovery();
    else if (game.state.status !== 'playing') showResult();
  }
  function resumeMode(mode) {
    if (!canWrite) return false;
    if (hasGame) save();
    const snapshot = store.get(mode);
    const candidate = mode === 'free' ? new DiscoFreeEngine.Game() : new DiscoEngine.Game();
    if (snapshot && candidate.restore(snapshot)) {
      game = candidate; currentMode = mode;
      const report = clock.resume(mode, game);
      enterGame(); showOfflineReport(report); return true;
    }
    return false;
  }
  function beginFree() {
    if (!canWrite) return;
    audio?.resumeFromGesture?.();
    if (resumeMode('free')) return;
    if (hasGame) save();
    currentMode = 'free'; game = new DiscoFreeEngine.Game(); game.startFree(); enterGame();
  }
  function selectChallenge() {
    if (!canWrite) return;
    showPanel({ title: '挑战模式', subtitle: '三个目标，逐步解锁。自由经营的进度会单独保留。',
      build(body) {
        body.className = 'panel-body menu-grid';
        if (store.get('challenge')) row(body, { title: '继续上次挑战', detail: '接着之前的进度营业', value: '继续', icon: '↗', action: () => resumeMode('challenge') });
        for (const objective of DiscoEngine.OBJECTIVES) {
          const unlocked = objective.level <= store.data.unlocked;
          row(body, { title: '第 ' + objective.level + ' 关 · ' + objective.title, detail: objective.description,
            value: unlocked ? '开始' : '未解锁', icon: String(objective.level), disabled: !unlocked,
            action: () => intro(objective.level) });
        }
      }, actions: [{ label: '返回', action: closePanel }] });
  }
  function intro(level) {
    const obj = DiscoEngine.OBJECTIVES[level - 1];
    describe('第 ' + level + ' 关 · ' + obj.title,
      [obj.description, '每个营业日为 30 秒，菜单打开时计时暂停。' + (store.get('challenge') ? '开始后将替换原来的闯关进度；自由经营不受影响。' : '')],
      { confirm: '开始挑战', action: () => { if (!canWrite) return; if (hasGame) save(); currentMode = 'challenge'; game = new DiscoEngine.Game(); game.start(level); enterGame(); }, cancel: selectChallenge, back: selectChallenge });
